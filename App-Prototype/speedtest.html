<script>/* assets/js/core.js */
/* Shared runtime of every thakurg.com page: texts, router, rendering, events, header, footer and small helpers.
   Moved from thakurg.html; the page-to-page parts (handing an address to another page, preferences from the dashboard) are marked "dashboard". */
'use strict';

const LANGS = [
  { code: 'en', native: 'English', dir: 'ltr', locale: 'en-US', home: '/' },
  { code: 'hi', native: 'हिन्दी', dir: 'ltr', locale: 'hi-IN', home: '/hi' },
  { code: 'ar', native: 'العربية', dir: 'rtl', locale: 'ar-AE', home: '/ar' },
];
const SKINS = [
  { id: 'glass', labelKey: 'theme.glass', chrome: '#170a1c' },
  { id: 'clay', labelKey: 'theme.clay', chrome: '#f1e3fb' },
  { id: 'skeu', labelKey: 'theme.skeu', chrome: '#c9ccd1' },
  { id: 'neu', labelKey: 'theme.neu', chrome: '#e0e5ec' },
];
const CONN_FIELDS = ['isp', 'ip', 'ipv4', 'ipv6', 'mac', 'location', 'testServer', 'networkType'];
const GAUGE_STOPS = [0, 5, 10, 25, 50, 75, 100, 250, 500, 1000, 2500, 5000, 10000];

const store = {
  get(key) {
    try {
      return localStorage.getItem('thakurg-proto-' + key);
    } catch {
      return null;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem('thakurg-proto-' + key, value);
    } catch {
      /* private mode: the prototype still works, it just forgets */
    }
  },
};

function defaultSettings() {
  const features = {};
  FEATURES.forEach((f) => (features[f.id] = true));
  const fields = {};
  CONN_FIELDS.forEach((f) => (fields[f] = true));
  return {
    features,
    speed: { gaugeStops: GAUGE_STOPS.slice() },
    connection: { enabled: true, fields },
    services: { enabled: true, refreshSeconds: 120, items: SERVICES.map((s) => ({ id: s.id, name: s.name, enabled: true })) },
  };
}

// dashboard: /master's settings are shared by every page of this tab (sessionStorage), like they were shared in the single file.
function loadSettings(kind) {
  try {
    const v = JSON.parse(sessionStorage.getItem('thakurg-proto-' + kind));
    if (v && v.features && v.connection && v.services && v.speed)
      return Object.assign(defaultSettings(), v);
  } catch {
    /* nothing saved yet */
  }
  return defaultSettings();
}

let settingsSnapshot = '';
function persistSettings() {
  const snap = JSON.stringify([S.saved, S.settings]);
  if (snap === settingsSnapshot)
    return;
  settingsSnapshot = snap;
  try {
    sessionStorage.setItem('thakurg-proto-saved', JSON.stringify(S.saved));
    sessionStorage.setItem('thakurg-proto-settings', JSON.stringify(S.settings));
  } catch {
    /* private mode */
  }
}

const S = {
  lang: 'en',
  skin: SKINS.some((s) => s.id === store.get('skin')) ? store.get('skin') : 'glass',
  themeOpen: false,
  route: { path: '/', parts: [], query: {} },
  saved: loadSettings('saved'),
  settings: loadSettings('settings'),
};

// #region Text

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fill = (text, params) => (params ? text.replace(/\{(\w+)\}/g, (m, k) => (k in params ? params[k] : m)) : text);

/** i18n.t(): the page's text in the chosen language, English when a key has no translation. */
function t(key, params) {
  const text = DICT[S.lang][key] ?? DICT.en[key];
  if (text === undefined) {
    console.warn('[proto] missing key', key);
    return key;
  }
  return esc(fill(text, params));
}

/** Raw (not escaped) text, for attributes built by esc() later or for document.title. */
const traw = (key, params) => fill(DICT[S.lang][key] ?? DICT.en[key] ?? key, params);

const pageName = (id) => esc(PAGES[S.lang][id] ?? PAGES.en[id] ?? id);

/** An API message from the Messages table, with {0}, {1} placeholders, in the chosen language. */
function msg(code, ...args) {
  const row = MESSAGES[code];
  const text = row ? row[S.lang] ?? row.en : code;
  return text.replace(/\{(\d+)\}/g, (m, i) => (args[i] !== undefined ? args[i] : m));
}

const langInfo = () => LANGS.find((l) => l.code === S.lang);
const on = (feature) => S.settings.features[feature] !== false;

// #endregion

// #region Router

const BARE = /^\/(HR|khata\/(app|login|set-pin|unlock))(\/|$)/;
const PAGE_FEATURE = [
  [/^\/(hi|ar)?$/, 'page.speed'],
  [/^\/youtube$/, 'page.youtube'],
  [/^\/(creta|creta-add)$/, 'page.creta'],
  [/^\/(nexon|nexon-add)$/, 'page.nexon'],
  [/^\/HR$/, 'page.hr'],
  [/^\/about$/, 'page.about'],
  [/^\/privacy$/, 'page.privacy'],
  [/^\/terms$/, 'page.terms'],
  [/^\/khata(\/|$)/, 'page.khata'],
];
const REDIRECTS = ROUTE_REDIRECTS;

function readRoute() {
  const raw = location.hash.startsWith('#/') ? location.hash.slice(1) : '/';
  const [p, q = ''] = raw.split('?');
  let path = p.replace(/\/+$/, '') || '/';
  if (REDIRECTS[path])
    path = REDIRECTS[path];
  const query = Object.fromEntries(new URLSearchParams(q));
  return { path, parts: path.split('/').filter(Boolean), query };
}

function go(path, replace) {
  // dashboard: another page owns the address.
  if (!BRIDGE.owns(path))
    return BRIDGE.leave(path);
  const url = '#' + path;
  if (replace)
    history.replaceState(null, '', url);
  else
    history.pushState(null, '', url);
  route();
}

const link = (path) => '#' + path;

/** Finds the page for the address, runs the guards and draws it. */
function route() {
  const before = S.route.path;
  const next = readRoute();
  // dashboard: an address of another page (typed, or reached with Back): keep this page as it was and hand the address over.
  if (!BRIDGE.owns(next.path)) {
    if (before)
      history.replaceState(null, '', '#' + before);
    return BRIDGE.leave(location.hash.slice(1) || '/');
  }
  S.route = next;
  if (S.route.path !== before) {
    if (typeof stopAllPlayback === 'function')
      stopAllPlayback();
    if (typeof running === 'function' && running())
      stStop(false);
  }
  S.themeOpen = false;
  const path = S.route.path;
  const feature = PAGE_FEATURE.find(([re]) => re.test(path));
  if (feature && !on(feature[1]))
    return go('/disabled', true);
  if (path === '/' || path === '/hi' || path === '/ar')
    setLang(path === '/' ? 'en' : path.slice(1), false);
  else if (path === '/HR')
    setLang('en', false);
  const guard = typeof khataGuard === 'function' ? khataGuard(path) : null;
  if (guard)
    return go(guard, true);
  leavePage();
  render(true);
  BRIDGE.report(location.hash.slice(1) || '/');
}

// #endregion

// #region Rendering

let cleanup = [];
function leavePage() {
  cleanup.forEach((fn) => fn());
  cleanup = [];
}

/** The view for the current route: [html, scope class, seo title key, after-render hook]. */
function view() {
  const p = S.route.path;
  const parts = S.route.parts;
  if (p === '/' || p === '/hi' || p === '/ar')
    return speedPage();
  if (p === '/youtube')
    return ytPage();
  if (p === '/creta' || p === '/nexon')
    return playerPage(parts[0]);
  if (p === '/creta-add' || p === '/nexon-add')
    return addPage(parts[0].replace('-add', ''));
  if (p === '/master')
    return cfgPage();
  if (p === '/about' || p === '/privacy' || p === '/terms')
    return staticPage(parts[0]);
  if (p === '/HR')
    return hrPage();
  if (p === '/offline' || p === '/error')
    return statusPage(parts[0]);
  if (parts[0] === 'khata')
    return khataView(parts);
  return statusPage('404');
}

function render(scrollTop) {
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const caret = focusId && 'selectionStart' in active ? [active.selectionStart, active.selectionEnd] : null;
  leavePage();
  const bare = BARE.test(S.route.path);
  const v = view();
  document.documentElement.lang = S.lang;
  document.documentElement.dir = langInfo().dir;
  document.documentElement.setAttribute('data-skin', S.skin);
  document.querySelector('meta[name=theme-color]').content = SKINS.find((s) => s.id === S.skin).chrome;
  document.title = v.title;
  document.getElementById('app').innerHTML =
    (bare ? '' : `<a class="skip" href="#main" data-act="skip">${t('a11y.skip')}</a>` + headerHtml()) +
    `<main id="main" tabindex="-1" class="${bare ? 'bare' : ''}">${v.html}</main>` +
    (bare ? '' : footerHtml()) +
    demoMenuHtml();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (caret && el.setSelectionRange)
        try {
          el.setSelectionRange(caret[0], caret[1]);
        } catch {
          /* inputs such as type=email have no caret */
        }
    }
  }
  if (v.after)
    v.after();
  if (scrollTop)
    window.scrollTo(0, 0);
  persistSettings();
  measureFooter();
}

// Prototype: the footer is fixed to the bottom; the page keeps exactly its height free below the content (it changes with the language and the width).
function measureFooter() {
  const foot = document.querySelector('.sc-footer .foot');
  if (foot)
    document.documentElement.style.setProperty('--foot-h', foot.offsetHeight + 'px');
}
window.addEventListener('resize', measureFooter);

/** Wraps a page in its component host element, like Angular's emulated encapsulation does. */
const host = (cls, html) => `<div class="ng-host ${cls}">${html}</div>`;

// #endregion

// #region Events

const ACT = {};
const SUBMIT = {};
const CHANGE = {};
const INPUT = {};

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (el && !el.disabled) {
    const fn = ACT[el.dataset.act];
    if (fn) {
      ev.preventDefault();
      fn(el, ev);
    }
  }
  if (S.themeOpen && !ev.target.closest('.menu')) {
    S.themeOpen = false;
    render();
  }
});
document.addEventListener('submit', (ev) => {
  const fn = SUBMIT[ev.target.dataset.submit];
  if (fn) {
    ev.preventDefault();
    fn(ev.target, new FormData(ev.target));
  }
});
document.addEventListener('change', (ev) => {
  const fn = CHANGE[ev.target.dataset.change];
  if (fn)
    fn(ev.target, ev);
});
document.addEventListener('input', (ev) => {
  const fn = INPUT[ev.target.dataset.input];
  if (fn)
    fn(ev.target, ev);
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && S.themeOpen) {
    S.themeOpen = false;
    render();
  }
  if (typeof keypadKey === 'function')
    keypadKey(ev);
});
window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);

ACT.skip = () => document.getElementById('main').focus();

// dashboard: a link to an address that another page owns goes through the dashboard (or straight to that file), not through this page's history.
document.addEventListener('click', (ev) => {
  const a = ev.target.closest && ev.target.closest('a[href^="#/"]');
  if (!a || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey)
    return;
  const path = a.getAttribute('href').slice(1);
  if (BRIDGE.owns(path))
    return;
  ev.preventDefault();
  BRIDGE.leave(path);
}, true);

// dashboard: the sidebar asks for another address of this same page.
BRIDGE.on('goto', (d) => go(d.path));

// dashboard: language, skin or light / dark changed in the dashboard (or in another page).
PREFS.onChange((p) => {
  S.skin = p.skin;
  if (typeof K !== 'undefined' && typeof applyTheme === 'function' && K.theme !== p.mode) {
    K.theme = p.mode;
    applyTheme(true);
  }
  if (p.lang !== S.lang)
    return CHANGE.siteLang({ value: p.lang });
  render();
});

function setLang(code, redraw = true) {
  S.lang = code;
  store.set('lang', code);
  PREFS.announce();
  if (redraw)
    render();
}

// #endregion

// #region Header and footer

const onSpeedRoute = () => /^\/(hi|ar)?$/.test(S.route.path);
const ICON_GAUGE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>';
const ICON_PALETTE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 22a10 10 0 1 1 10-10c0 2.5-2 3-3.5 3H16a2 2 0 0 0-1.5 3.3c.6.8.3 3.7-2.5 3.7z"/></svg>';

function langSelect(id, act) {
  return `<select id="${id}" class="btn sm" data-change="${act}">${LANGS.map((l) => `<option value="${l.code}"${l.code === S.lang ? ' selected' : ''}>${l.native}</option>`).join('')}</select>`;
}

function headerHtml() {
  const home = link(langInfo().home);
  const speed = onSpeedRoute();
  let left = '';
  if (speed) {
    left = `<a class="brand" href="${home}" aria-label="${t('brand.name')}">
        <span class="brand-mark" aria-hidden="true">${ICON_GAUGE}</span>
        <span class="brand-text"><b>${t('brand.name')}</b><small>${t('brand.sub')}</small></span>
      </a>`;
    if (on('site.nav')) {
      left += `<nav class="nav" aria-label="${t('nav.main')}">
        <a href="${home}" class="on" aria-current="page">${pageName('speed')}</a>
        ${S.settings.connection.enabled ? `<a href="#" data-act="jump" data-to="connection-details">${pageName('connection')}</a>` : ''}
        ${S.settings.services.enabled ? `<a href="#" data-act="jump" data-to="services-status">${pageName('services')}</a>` : ''}
      </nav>`;
    }
  }
  let tools = '';
  if (on('site.theme')) {
    tools += `<div class="menu">
        <button type="button" class="btn sm icon${S.themeOpen ? ' is-on' : ''}" aria-haspopup="true" aria-expanded="${S.themeOpen}" aria-controls="theme-menu" aria-label="${t('theme.label')}" data-act="theme">${ICON_PALETTE}</button>
        ${S.themeOpen ? `<div class="pop card" id="theme-menu" role="group" aria-label="${t('theme.label')}">${SKINS.map((s) => `<button type="button" class="skin-opt${S.skin === s.id ? ' on' : ''}" aria-pressed="${S.skin === s.id}" data-act="skin" data-id="${s.id}"><span class="swatch" data-skin="${s.id}" aria-hidden="true"></span><span>${t(s.labelKey)}</span></button>`).join('')}</div>` : ''}
      </div>`;
  }
  if (on('site.language'))
    tools += `<label class="lang"><span class="sr-only">${t('lang.label')}</span>${langSelect('site-lang', 'siteLang')}</label>`;
  return host('sc-header', `<header class="bar"><div class="wrap bar-in">${left}<div class="tools${speed ? '' : ' solo'}">${tools}</div></div></header>`);
}

function footerHtml() {
  let links = '';
  if (on('site.footer')) {
    if (on('page.about'))
      links += `<a href="${link('/about')}">${pageName('about')}</a>`;
    if (on('page.privacy'))
      links += `<a href="${link('/privacy')}">${pageName('privacy')}</a>`;
    if (on('page.terms'))
      links += `<a href="${link('/terms')}">${pageName('terms')}</a>`;
  }
  return host('sc-footer', `<footer class="foot"><div class="wrap foot-in"><nav class="links" aria-label="${t('nav.pages')}">${links}</nav><p>&copy; ${new Date().getFullYear()} thakurg.com. ${t('ft.rights')}</p></div></footer>`);
}

ACT.theme = () => {
  S.themeOpen = !S.themeOpen;
  render();
};
ACT.skin = (el) => {
  S.skin = el.dataset.id;
  S.themeOpen = false;
  store.set('skin', S.skin);
  PREFS.announce();
  render();
};
ACT.jump = (el) => document.getElementById(el.dataset.to)?.scrollIntoView({ behavior: 'smooth' });
CHANGE.siteLang = (el) => {
  // The speed test pages take their language from the address; every other page just switches.
  if (onSpeedRoute())
    go(LANGS.find((l) => l.code === el.value).home);
  else
    setLang(el.value);
};

// #endregion

// #region Prototype menu (not part of the real site: it lists every page so the demo can reach them all)

const DEMO_LINKS = [
  ['Speed test', '/'], ['Speed test (Hindi)', '/hi'], ['Speed test (Arabic)', '/ar'], ['YouTube', '/youtube'],
  ['Creta audio', '/creta'], ['Creta: add songs', '/creta-add'], ['Nexon audio', '/nexon'], ['Nexon: add songs', '/nexon-add'],
  ['Atrium HR', '/HR'], ['SnapKhata (public page)', '/khata'], ['SnapKhata app', '/khata/app'], ['SnapKhata login', '/khata/login'],
  ['Settings (/master)', '/master'], ['About', '/about'], ['Privacy', '/privacy'], ['Terms', '/terms'],
  ['Page not found', '/404'], ['Something went wrong', '/error'], ['You are offline', '/offline'],
];
let demoOpen = false;
function demoMenuHtml() {
  return `<nav class="proto-menu${demoOpen ? ' open' : ''}" aria-label="Prototype pages" dir="ltr">
    <button type="button" class="btn sm pri" aria-expanded="${demoOpen}" data-act="demoMenu">Prototype pages</button>
    ${demoOpen ? `<div class="card proto-list">${DEMO_LINKS.map(([n, p]) => `<a href="${link(p)}"${S.route.path === p ? ' aria-current="page"' : ''}>${esc(n)}<small>${esc(p)}</small></a>`).join('')}</div>` : ''}
  </nav>`;
}
ACT.demoMenu = () => {
  demoOpen = !demoOpen;
  document.querySelector('.proto-menu').outerHTML = demoMenuHtml();
};
window.addEventListener('hashchange', () => (demoOpen = false));

// #endregion

// #region Small helpers

const fmtMbps = (n) => (n >= 100 ? n.toFixed(0) : n.toFixed(1));
const fmtSpeed = (mbps) => (mbps >= 10000 ? (mbps / 1000).toFixed(1) : mbps >= 1000 ? (mbps / 1000).toFixed(2) : fmtMbps(mbps));
const speedUnitKey = (mbps) => (mbps >= 1000 ? 'unit.gbps' : 'unit.mbps');
const clockTime = (sec) => {
  const s = Math.max(0, Math.floor(sec || 0));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const range = (n) => Array.from({ length: n }, (_, i) => i + 1);
const rand = (a, b) => a + Math.random() * (b - a);
const timeText = (at) => new Date(at).toLocaleTimeString(langInfo().locale, { hour: '2-digit', minute: '2-digit' });

/** Coloured cover art for demo songs and videos (an SVG data URL). */
function artUrl(seed, w, h, label) {
  const hue = (seed * 67) % 360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue},70%,55%)"/><stop offset="1" stop-color="hsl(${(hue + 60) % 360},70%,30%)"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><circle cx="${w / 2}" cy="${h / 2}" r="${Math.min(w, h) / 4}" fill="rgba(255,255,255,.18)"/><text x="50%" y="54%" font-family="sans-serif" font-size="${Math.min(w, h) / 5}" font-weight="700" fill="rgba(255,255,255,.9)" text-anchor="middle" dominant-baseline="middle">${esc(label || '')}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// #endregion


// Start: the saved language applies to every page except the speed test pages, which take it from the address.
// Runs after every script of the page has loaded, so the page's own views and state are defined.
function boot() {
  const saved = store.get('lang');
  if (saved && LANGS.some((l) => l.code === saved))
    S.lang = saved;
  if (typeof kLoad === 'function')
    kLoad();
  S.route = { path: '', parts: [], query: {} };
  if (!location.hash.startsWith('#/'))
    history.replaceState(null, '', '#' + routeHome(routeById(window.PAGE_ID), 'en'));
  route();
}

document.addEventListener('DOMContentLoaded', boot);
</script>
<script>/* assets/js/speedtest.js */
/* Speed test page. Moved from thakurg.html as it was; see App-Prototype/README.md for the page layout. */
'use strict';

// #region Speed test (simulated engine: same gauge, phases and texts as the real page, numbers are made up)

const ARC_START = 150;
const ARC_SWEEP = 240;
const SEGMENTS = 54;
const gaugeFraction = (mbps, stops) => {
  const v = Math.min(stops[stops.length - 1], Math.max(0, mbps));
  const next = stops.findIndex((s) => s > v);
  const i = next < 0 ? stops.length - 2 : next - 1;
  return (i + (v - stops[i]) / (stops[i + 1] - stops[i])) / (stops.length - 1);
};
const tickLabel = (mbps) => (mbps >= 1000 ? `${mbps / 1000}G` : String(mbps));
const gaugeAngle = (frac) => ARC_START + ARC_SWEEP * frac;
const polar = (r, deg) => [+(120 + r * Math.cos((deg * Math.PI) / 180)).toFixed(1), +(120 + r * Math.sin((deg * Math.PI) / 180)).toFixed(1)];
const litCount = (frac) => (frac > 0.002 ? Math.round(frac * (SEGMENTS - 1)) + 1 : 0);
const segClass = (i, lit) => (i < lit ? (i === lit - 1 ? 'on head' : 'on') : '');
let gaugePeak = 0;

const E = { phase: 'idle', gauge: 0, ping: null, jitter: null, down: null, up: null, loaded: null, startedAt: 0, finishedAt: 0, timer: null, progress: 0 };
const ST = { saved: false, shareOpen: false, copied: false, resultUrl: null };
let history_ = [];
try {
  history_ = JSON.parse(store.get('history') || '[]');
} catch {
  history_ = [];
}

const running = () => ['ping', 'down', 'up'].includes(E.phase);
const hasResult = () => E.phase === 'done';

function speedStatus() {
  switch (E.phase) {
    case 'ping':
      return t('st.ping_phase');
    case 'down':
      return t('st.down_phase');
    case 'up':
      return t('st.up_phase');
    case 'done':
      return t('st.complete', { time: timeText(E.finishedAt) });
    case 'stopped':
      return t('st.stopped');
    default:
      return t('st.ready');
  }
}

function gaugeUnit() {
  const scale = E.gauge >= 1000 ? 'gbps' : 'mbps';
  if (E.phase === 'down' || E.phase === 'done')
    return t(`unit.${scale}_down`);
  if (E.phase === 'up')
    return t(`unit.${scale}_up`);
  return t(`unit.${scale}`);
}

function loadedHint() {
  if (E.loaded === null || E.ping === null)
    return null;
  const extra = E.loaded - E.ping;
  return extra < 30 ? 'loaded.good' : extra < 100 ? 'loaded.fair' : 'loaded.bad';
}

function cell(key, phaseOn, value, unitHtml) {
  return `<div class="cell inset${E.phase === phaseOn ? ' on' : ''}${value !== null ? ' done' : ''}"><dt>${t(key)}</dt><dd>${value !== null ? `${value}<small>${unitHtml}</small>` : '–'}</dd></div>`;
}

function segmentsHtml(lit) {
  return Array.from({ length: SEGMENTS }, (_, i) => {
    const deg = gaugeAngle(i / (SEGMENTS - 1));
    const [x1, y1] = polar(84, deg);
    const [x2, y2] = polar(100, deg);
    return `<line class="${segClass(i, lit)}" style="--k: ${(i / (SEGMENTS - 1)).toFixed(3)}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" />`;
  }).join('');
}

function labelsHtml(stops, frac) {
  return stops.map((m, i) => {
    const f = i / (stops.length - 1);
    const [x, y] = polar(117, gaugeAngle(f));
    return `<text class="g-label${frac * 100 > 0.2 && f <= frac + 0.0001 ? ' on' : ''}" data-f="${f.toFixed(4)}" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${tickLabel(m)}</text>`;
  }).join('');
}

function dialHtml() {
  const stops = S.settings.speed.gaugeStops;
  const frac = gaugeFraction(E.gauge, stops);
  gaugePeak = E.gauge;
  return `<div class="dial${running() ? ' live' : ''}">
      <svg viewBox="-18 -18 276 218" role="img" aria-label="${speedStatus()}">
        <circle class="g-inner" cx="120" cy="120" r="72" />
        <g id="g-seg" class="g-seg" aria-hidden="true">${segmentsHtml(litCount(frac))}</g>
        <g aria-hidden="true">${labelsHtml(stops, frac)}</g>
        <g id="g-peak" class="g-peak" transform="rotate(${gaugeAngle(frac).toFixed(2)} 120 120)" style="opacity: ${frac * 100 > 0.2 ? 1 : 0}" aria-hidden="true"><path d="M223 120 L230 116 L230 124 Z" /></g>
      </svg>
      <div class="read" aria-hidden="true"><span class="val" id="g-val">${fmtSpeed(E.gauge)}</span><span class="unit" id="g-unit">${gaugeUnit()}</span></div>
    </div>`;
}

function shareText() {
  return traw('share.text', { down: `${fmtSpeed(E.down)} ${traw(speedUnitKey(E.down))}`, up: `${fmtSpeed(E.up)} ${traw(speedUnitKey(E.up))}`, ping: E.ping }) + ' https://thakurg.com/';
}

function heroHtml() {
  const ICON = {
    clock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    timer: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/></svg>',
    share: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
    save: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>',
    image: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  };
  const hint = on('speed.loaded') ? loadedHint() : null;
  const label = running() ? t('st.stop') : E.phase === 'idle' ? t('st.start') : t('st.again');
  let actions = '';
  if (hasResult()) {
    actions = `<div class="actions">
        ${on('speed.share') ? `<button type="button" class="btn" aria-haspopup="true" aria-expanded="${ST.shareOpen}" data-act="stShare">${ICON.share}${t('act.share')}</button>` : ''}
        ${on('speed.save') ? `<button type="button" class="btn"${ST.saved ? ' disabled' : ''} data-act="stSave">${ICON.save}${ST.saved ? t('act.saved') : t('act.save')}</button>` : ''}
        ${on('speed.image') ? `<button type="button" class="btn" data-act="stImage">${ICON.image}${t('act.image')}</button>` : ''}
      </div>`;
    if (on('speed.share') && ST.shareOpen) {
      const text = encodeURIComponent(shareText());
      const links = [
        ['share.whatsapp', `https://wa.me/?text=${text}`],
        ['share.x', `https://x.com/intent/post?text=${text}`],
        ['share.facebook', `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent('https://thakurg.com/')}`],
        ['share.telegram', `https://t.me/share/url?url=${encodeURIComponent('https://thakurg.com/')}&text=${text}`],
      ];
      actions += `<div class="share-panel inset" role="group" aria-label="${t('share.menu')}"><span class="share-h">${t('share.menu')}</span>
          ${links.map(([k, href]) => `<a class="btn sm" href="${href}" target="_blank" rel="noopener noreferrer">${t(k)}</a>`).join('')}
          <button type="button" class="btn sm" data-act="stCopy">${ST.copied ? t('act.copied') : t('act.copy')}</button></div>`;
    }
  }
  return `<section class="card hero" id="st-hero" aria-labelledby="st-h1">
    <h1 id="st-h1">${t('st.h1a')} <em>${t('st.h1b')}</em></h1>
    <p class="lead">${t('st.lead')}</p>
    <div class="hero-grid"><div class="hero-meter">
    ${ST.resultUrl ? `<img class="result-img" src="${ST.resultUrl}" width="1200" height="630" alt="${speedStatus()}" />` : dialHtml()}
    ${on('speed.clock') ? `<div class="live" role="group" aria-label="${t('clk.now')}">
      <span class="chip inset">${ICON.clock}<span class="k">${t('clk.now')}</span><span class="v" id="clk-now">${new Date().toLocaleTimeString(langInfo().locale)}</span></span>
      <span class="chip inset">${ICON.timer}<span class="k">${t('clk.elapsed')}</span><span class="v" id="clk-el">${elapsedText()}</span></span>
    </div>` : ''}
    ${on('speed.progress') ? `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(E.progress)}" aria-label="${speedStatus()}"><i id="prog-i" style="width: ${E.progress}%"></i></div>` : ''}
    </div><div class="hero-side">
    <p class="status" aria-live="polite">${speedStatus()}</p>
    <button type="button" class="btn pri lg go${running() ? ' stop' : ''}" data-act="stGo">${label}</button>
    <dl class="res" aria-label="${t('res.label')}">
      ${cell('res.download', 'down', E.down !== null ? fmtSpeed(E.down) : null, E.down !== null ? t(speedUnitKey(E.down)) : '')}
      ${cell('res.upload', 'up', E.up !== null ? fmtSpeed(E.up) : null, E.up !== null ? t(speedUnitKey(E.up)) : '')}
      ${cell('res.ping', 'ping', E.ping, t('unit.ms'))}
      ${cell('res.jitter', 'ping', E.jitter, t('unit.ms'))}
    </dl>
    ${hint ? `<p class="loaded inset${hint === 'loaded.bad' ? ' bad' : ''}"><span class="k">${t('res.loaded')}</span><b>${E.loaded}<small>${t('unit.ms')}</small></b><span class="hint">${t(hint)}</span></p>` : ''}
    ${actions}
    </div></div>
    <p class="note">${t('st.note')}</p>
  </section>`;
}

function elapsedText() {
  if (!E.startedAt)
    return '0:00';
  return clockTime(((E.finishedAt || Date.now()) - E.startedAt) / 1000);
}

function histHtml() {
  const items = history_.length
    ? `<ul class="hist-list">${history_.map((r) => `<li class="inset"><div><time datetime="${new Date(r.at).toISOString()}">${esc(new Date(r.at).toLocaleString(langInfo().locale, { dateStyle: 'medium', timeStyle: 'short' }))}</time>
        <p>${t('hist.item', { down: `${fmtSpeed(r.down)} ${traw(speedUnitKey(r.down))}`, up: `${fmtSpeed(r.up)} ${traw(speedUnitKey(r.up))}`, ping: Math.round(r.ping), jitter: r.jitter.toFixed(1) })}</p></div>
        <button type="button" class="btn sm" data-act="histDel" data-id="${r.id}">${t('hist.delete')}</button></li>`).join('')}</ul>`
    : `<p class="empty">${t('hist.empty')}</p>`;
  return `<section class="card hist" aria-labelledby="hist-h"><div class="hist-head"><h2 id="hist-h">${t('hist.title')}</h2>
      ${history_.length ? `<button type="button" class="btn sm" data-act="histClear">${t('hist.clear')}</button>` : ''}</div>${items}<p class="note">${t('hist.note')}</p></section>`;
}

function infoHtml() {
  const list = (prefix, n) => range(n).map((i) => `<li>${t(`${prefix}.${i}`)}</li>`).join('');
  return `<article class="card prose info" id="about-speed-test">
    <h2>${t('info.h2.intro')}</h2><p>${t('info.intro')}</p>
    <h2>${t('info.h2.mean')}</h2><ul>${list('info.mean', 4)}</ul>
    <h2>${t('info.h2.good')}</h2><p>${t('info.good')}</p>
    <h2>${t('info.h2.accurate')}</h2><ol>${list('info.acc', 4)}</ol>
    <h2>${t('info.h2.fix')}</h2><ul>${list('info.fix', 6)}</ul>
    <h2>${t('info.h2.faq')}</h2>
    ${range(8).map((i) => `<details><summary>${t(`faq.${i}.q`)}</summary><p>${t(`faq.${i}.a`)}</p></details>`).join('')}
  </article>`;
}

function speedPage() {
  const html = `<div class="wrap page">${heroHtml()}
    ${S.settings.connection.enabled ? host('sc-conn', connHtml()) : ''}
    ${S.settings.services.enabled ? host('sc-svc', svcHtml()) : ''}
    ${on('speed.history') ? histHtml() : ''}
    ${on('speed.info') ? infoHtml() : ''}</div>`;
  return {
    title: traw('seo.home.title'),
    html: host('sc-speed', html),
    after() {
      const clock = setInterval(() => {
        const now = document.getElementById('clk-now');
        if (now)
          now.textContent = new Date().toLocaleTimeString(langInfo().locale);
      }, 1000);
      cleanup.push(() => clearInterval(clock));
      if (!SV.checkedAt && !SV.checking)
        svcCheck();
    },
  };
}

function redrawHero() {
  const el = document.getElementById('st-hero');
  if (el)
    el.outerHTML = heroHtml();
}

/** Moves only the needle, numbers and progress bar between phase changes, so buttons are not redrawn under the pointer. */
function paintGauge() {
  const stops = S.settings.speed.gaugeStops;
  const frac = gaugeFraction(E.gauge, stops);
  const seg = document.getElementById('g-seg');
  if (seg) {
    const lit = litCount(frac);
    [...seg.children].forEach((el, i) => el.setAttribute('class', segClass(i, lit)));
    gaugePeak = Math.max(gaugePeak, E.gauge);
    const peakFrac = gaugeFraction(gaugePeak, stops);
    const peak = document.getElementById('g-peak');
    peak.setAttribute('transform', `rotate(${gaugeAngle(peakFrac).toFixed(2)} 120 120)`);
    peak.style.opacity = peakFrac * 100 > 0.2 ? '1' : '0';
    document.querySelectorAll('.sc-speed .g-label').forEach((el) => el.classList.toggle('on', lit > 0 && +el.dataset.f <= frac + 0.0001));
    document.getElementById('g-val').textContent = fmtSpeed(E.gauge);
    document.getElementById('g-unit').innerHTML = gaugeUnit();
  }
  const prog = document.getElementById('prog-i');
  if (prog)
    prog.style.width = E.progress + '%';
  const el = document.getElementById('clk-el');
  if (el)
    el.textContent = elapsedText();
}

const PHASES = [
  { id: 'ping', ms: 2500 },
  { id: 'down', ms: 7000 },
  { id: 'up', ms: 6000 },
];

function stRun() {
  const target = { down: rand(120, 340), up: rand(30, 95), ping: Math.round(rand(9, 28)), jitter: +rand(0.6, 4.5).toFixed(1) };
  Object.assign(E, { phase: 'ping', gauge: 0, ping: null, jitter: null, down: null, up: null, loaded: null, startedAt: Date.now(), finishedAt: 0, progress: 0 });
  Object.assign(ST, { saved: false, shareOpen: false, copied: false, resultUrl: null });
  const total = PHASES.reduce((s, p) => s + p.ms, 0);
  let index = 0;
  let phaseStart = performance.now();
  redrawHero();
  const step = () => {
    const p = PHASES[index];
    const k = Math.min(1, (performance.now() - phaseStart) / p.ms);
    const done = PHASES.slice(0, index).reduce((s, x) => s + x.ms, 0);
    E.progress = ((done + k * p.ms) / total) * 100;
    if (p.id === 'down' || p.id === 'up') {
      const ramp = 1 - Math.pow(1 - Math.min(1, k * 2.2), 3);
      E.gauge = target[p.id] * ramp * (1 + Math.sin(k * 40) * 0.04 * ramp);
    } else {
      E.gauge = 0;
    }
    paintGauge();
    if (k < 1) {
      E.timer = requestAnimationFrame(step);
      return;
    }
    if (p.id === 'ping') {
      E.ping = target.ping;
      E.jitter = target.jitter;
    } else {
      E[p.id] = +target[p.id].toFixed(1);
      if (p.id === 'down')
        E.loaded = target.ping + Math.round(rand(8, 70));
    }
    index++;
    if (index === PHASES.length) {
      E.phase = 'done';
      E.gauge = E.down;
      E.finishedAt = Date.now();
      E.progress = 100;
      redrawHero();
      return;
    }
    E.phase = PHASES[index].id;
    E.gauge = 0;
    phaseStart = performance.now();
    redrawHero();
    E.timer = requestAnimationFrame(step);
  };
  E.timer = requestAnimationFrame(step);
}

function stStop(redraw = true) {
  cancelAnimationFrame(E.timer);
  E.phase = 'stopped';
  E.gauge = 0;
  E.finishedAt = Date.now();
  if (redraw)
    redrawHero();
}
ACT.stGo = () => (running() ? stStop() : stRun());
ACT.stShare = () => {
  ST.shareOpen = !ST.shareOpen;
  redrawHero();
};
ACT.stCopy = () => {
  navigator.clipboard?.writeText(shareText()).catch(() => null);
  ST.copied = true;
  redrawHero();
};
ACT.stSave = () => {
  history_.unshift({ id: Date.now(), at: E.finishedAt, down: E.down, up: E.up, ping: E.ping, jitter: E.jitter });
  store.set('history', JSON.stringify(history_.slice(0, 50)));
  ST.saved = true;
  render();
};
ACT.histDel = (el) => {
  history_ = history_.filter((r) => String(r.id) !== el.dataset.id);
  store.set('history', JSON.stringify(history_));
  render();
};
ACT.histClear = () => {
  history_ = [];
  store.set('history', '[]');
  render();
};

/** Draws the 1200 × 630 result card, shows it in place of the gauge and offers it as a download. */
ACT.stImage = () => {
  const c = document.createElement('canvas');
  c.width = 1200;
  c.height = 630;
  const g = c.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const grad = g.createLinearGradient(0, 0, 1200, 630);
  grad.addColorStop(0, '#2a1033');
  grad.addColorStop(1, '#170a1c');
  g.fillStyle = grad;
  g.fillRect(0, 0, 1200, 630);
  g.fillStyle = css.getPropertyValue('--accent').trim() || '#e3bd68';
  g.font = '700 54px Fraunces Variable, serif';
  g.fillText(traw('share.title'), 70, 120);
  const cells = [
    [traw('res.download'), fmtSpeed(E.down), traw(speedUnitKey(E.down))],
    [traw('res.upload'), fmtSpeed(E.up), traw(speedUnitKey(E.up))],
    [traw('res.ping'), String(E.ping), traw('unit.ms')],
    [traw('res.jitter'), String(E.jitter), traw('unit.ms')],
  ];
  cells.forEach(([k, v, u], i) => {
    const x = 70 + (i % 2) * 540;
    const y = 230 + Math.floor(i / 2) * 180;
    g.fillStyle = 'rgba(255,255,255,.08)';
    g.fillRect(x - 20, y - 70, 500, 150);
    g.fillStyle = '#cfc1d6';
    g.font = '600 30px Manrope Variable, sans-serif';
    g.fillText(k, x, y - 25);
    g.fillStyle = '#f5ecf7';
    g.font = '800 64px Manrope Variable, sans-serif';
    g.fillText(`${v} ${u}`, x, y + 50);
  });
  g.fillStyle = '#cfc1d6';
  g.font = '600 28px Manrope Variable, sans-serif';
  g.fillText('thakurg.com', 70, 590);
  ST.resultUrl = c.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = ST.resultUrl;
  a.download = 'speed-test.png';
  a.click();
  redrawHero();
};

// #endregion
</script>
<script>/* assets/js/connection-details.js */
/* Connection details (speed test page). Moved from thakurg.html as it was; see App-Prototype/README.md for the page layout. */
'use strict';

// #region Connection details

const CONN = { loading: false, values: null };

function connValues() {
  const nav = navigator.connection;
  const type = nav && nav.type ? (['wifi', 'cellular', 'ethernet', 'bluetooth'].includes(nav.type) ? `conn.net.${nav.type}` : 'conn.net.other') : 'conn.net.unknown';
  return {
    isp: { text: 'Demo Broadband Pvt Ltd (prototype)', found: true },
    ip: { text: '203.0.113.42', found: true },
    ipv4: { text: '203.0.113.42', found: true },
    ipv6: { text: traw('conn.noipv6'), found: false },
    mac: { text: traw('conn.mac_na'), found: false },
    location: { text: 'Mumbai, Maharashtra, India', found: true },
    testServer: { text: 'Thakurg', found: true },
    networkType: { text: traw(type), found: type !== 'conn.net.unknown' },
  };
}

function connHtml() {
  const values = CONN.loading ? null : connValues();
  const rows = CONN_FIELDS.filter((f) => S.settings.connection.fields[f]).map((f) => {
    const v = values ? values[f] : { text: traw('conn.detecting'), found: false };
    return `<div class="cell inset"><dt>${t('conn.' + f)}</dt><dd class="${v.found ? '' : 'na'}">${esc(v.text)}</dd></div>`;
  });
  return `<section class="card conn" id="connection-details" aria-labelledby="conn-h">
    <div class="head"><h2 id="conn-h">${pageName('connection')}</h2><button type="button" class="btn sm"${CONN.loading ? ' disabled' : ''} data-act="connReload">${t('conn.refresh')}</button></div>
    <p class="lead">${t('conn.lead')}</p><dl class="grid" aria-live="polite">${rows.join('')}</dl><p class="note">${t('conn.note')}</p></section>`;
}

ACT.connReload = () => {
  CONN.loading = true;
  render();
  setTimeout(() => {
    CONN.loading = false;
    render();
  }, 900);
};

// #endregion
</script>
<script>/* assets/js/service-status.js */
/* Services status (speed test page). Moved from thakurg.html as it was; see App-Prototype/README.md for the page layout. */
'use strict';

// #region Services status

const SV = { results: {}, checkedAt: 0, checking: false };

function svcCheck() {
  SV.checking = true;
  SV.results = {};
  if (onSpeedRoute())
    render();
  setTimeout(() => {
    S.settings.services.items.forEach((s) => {
      const info = SERVICES.find((x) => x.id === s.id);
      const roll = Math.random();
      SV.results[s.id] = { state: roll < 0.86 ? 'operational' : roll < 0.95 ? 'degraded' : 'outage', source: info.status ? 'official' : 'probe' };
    });
    SV.checkedAt = Date.now();
    SV.checking = false;
    if (onSpeedRoute())
      render();
  }, 1200);
}

function svcHtml() {
  const items = S.settings.services.items.filter((s) => s.enabled);
  const issues = Object.values(SV.results).filter((r) => r.state !== 'operational').length;
  const summary = SV.checkedAt && !SV.checking ? `${issues ? t('svc.issues', { n: issues }) : t('svc.all_ok')} ${t('svc.checked', { time: timeText(SV.checkedAt) })}` : t('svc.checking');
  const groups = ['apps', 'telecom'].map((g) => ({ g, list: items.filter((s) => SERVICES.find((x) => x.id === s.id).group === g) })).filter((x) => x.list.length);
  return `<section class="card svc" id="services-status" aria-labelledby="svc-h">
    <div class="head"><h2 id="svc-h">${pageName('services')}</h2><button type="button" class="btn sm" data-act="svcCheck">${t('svc.refresh')}</button></div>
    <p class="lead">${t('svc.lead')}</p><p class="summary" aria-live="polite">${summary}</p>
    ${groups.map(({ g, list }) => `<h3>${t('svc.group.' + g)}</h3><ul class="list">${list.map((s) => {
      const r = SV.results[s.id];
      const state = r ? r.state : 'checking';
      const info = SERVICES.find((x) => x.id === s.id);
      return `<li class="tile" data-state="${state}"><a class="name" href="${esc(info.url)}" target="_blank" rel="noopener noreferrer" aria-label="${t('svc.open', { name: s.name })}">${esc(s.name)}</a>
        <span class="pill"><i class="dot" aria-hidden="true"></i>${t('svc.' + state)}</span><small class="src">${t(r && r.source === 'official' ? 'svc.official' : 'svc.probe')}</small></li>`;
    }).join('')}</ul>`).join('')}
    <p class="note">${t('svc.note')}</p></section>`;
}

ACT.svcCheck = () => svcCheck();

// #endregion
</script>
</body>
</html>
