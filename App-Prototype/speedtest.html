<style>/* assets/css/site-header.css */
/* Site header. Moved from thakurg.html as it was. */
/* src/app/shared/site-header.scss */
.sc-header {
  display: block;
  position: sticky;
  inset-block-start: 0;
  z-index: 50;
}

.sc-header .bar {
  background: var(--header-bg);
  border-block-end: var(--header-border);
  -webkit-backdrop-filter: var(--header-filter);
  backdrop-filter: var(--header-filter);
}

.sc-header .bar-in {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding-block: 10px;
}

.sc-header .brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  text-decoration: none;
  margin-inline-end: auto;
}

.sc-header .brand-mark {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: var(--pri-bg);
  color: var(--pri-color);
  box-shadow: var(--pri-shadow);
}

.sc-header .brand-text {
  display: grid;
  line-height: 1.15;
}

.sc-header .brand-text b {
  font-size: 16px;
}

.sc-header .brand-text small {
  font-size: 12px;
  color: var(--muted);
}

.sc-header .nav {
  display: flex;
  gap: 4px;
  order: 3;
  width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
  padding-block: 2px;
}

.sc-header .nav::-webkit-scrollbar {
  display: none;
}

.sc-header .nav a {
  flex: none;
  padding: 9px 14px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  border-radius: 12px;
  color: var(--text);
  font-weight: 600;
  font-size: 15px;
  text-decoration: none;
}

.sc-header .nav a:hover {
  box-shadow: var(--btn-shadow);
}

.sc-header .nav a.on {
  box-shadow: var(--btn-active-shadow);
  color: var(--accent-ink);
  font-weight: 800;
}

.sc-header .tools {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.sc-header .lang select {
  /* Language names are written in their own scripts, so use system fonts and skip downloading web fonts for them. */
  font-family: system-ui, "Segoe UI", "Nirmala UI", "Noto Sans", sans-serif;
  appearance: auto;
  padding-inline: 10px;
  max-width: 130px;
}

.sc-header .lang select option {
  color: #111;
  background: #fff;
}

.sc-header .menu {
  position: relative;
}

.sc-header .pop {
  position: absolute;
  inset-block-start: calc(100% + 10px);
  inset-inline-end: 0;
  width: min(280px, 100vw - 32px);
  padding: 10px;
  display: grid;
  gap: 6px;
  z-index: 60;
  border-radius: 22px;
}

.sc-header .skin-opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 48px;
  padding: 8px 12px;
  border: 0;
  border-radius: 14px;
  background: transparent;
  color: var(--text);
  font: 600 15px var(--font-body);
  text-align: start;
  cursor: pointer;
}

.sc-header .skin-opt:hover {
  box-shadow: var(--btn-shadow);
}

.sc-header .skin-opt.on {
  box-shadow: var(--btn-active-shadow);
  font-weight: 800;
}

/* Small previews, each drawn in its own skin so the choice is visible before picking */
.sc-header .swatch {
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 10px;
}

.sc-header .swatch[data-skin=glass] {
  background: linear-gradient(135deg, #9d4a82, #3a1631);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.4);
}

.sc-header .swatch[data-skin=clay] {
  background: #f1d8ff;
  border-radius: 14px;
  box-shadow: 3px 3px 6px rgba(137, 104, 190, 0.5), -3px -3px 6px #fff, inset -2px -2px 4px rgba(137, 104, 190, 0.3);
}

.sc-header .swatch[data-skin=skeu] {
  background: linear-gradient(180deg, #fff, #c4c8ce);
  border: 1px solid #737982;
  box-shadow: 0 1px 0 #fff inset, 0 2px 3px rgba(0, 0, 0, 0.4);
}

.sc-header .swatch[data-skin=neu] {
  background: #e0e5ec;
  box-shadow: 3px 3px 6px #a3b1c6, -3px -3px 6px #fff;
}

.sc-header .ios {
  max-width: 420px;
  margin: auto;
  color: var(--text);
  border: var(--card-border);
}

.sc-header .ios::backdrop {
  background: rgba(0, 0, 0, 0.55);
}

@media (min-width: 820px) {
  .sc-header .nav {
    order: 0;
    width: auto;
    overflow: visible;
  }
  .sc-header .brand {
    margin-inline-end: 0;
  }
  .sc-header .tools {
    margin-inline-start: auto;
  }
}
@media (max-width: 420px) {
  .sc-header .brand-text small {
    display: none;
  }
  .sc-header .btn.pri span {
    display: none;
  }
  .sc-header .btn.pri {
    min-width: 44px;
    padding-inline: 10px;
  }
}
/* Without the brand on the left, keep the tools at the end of the bar. */
.sc-header .tools.solo {
  margin-inline-start: auto;
}

/* Prototype: the bar spans the full width, so the skin and language pickers sit in the top-right corner of every page, with a slimmer bar. */
.sc-header .bar-in {
  width: auto;
  margin-inline: 0;
  padding-inline: 16px;
  padding-block: 4px;
  gap: 4px 12px;
}

.sc-header .tools {
  margin-inline-start: auto;
}

/* Prototype, wide screens: a slimmer bar (smaller logo, links and pickers) so pages get more room. Phones keep the 44px tap targets. */
@media (min-width: 820px) {
  .sc-header .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 11px;
  }

  .sc-header .brand-text b {
    font-size: 15px;
  }

  .sc-header .brand-text small {
    font-size: 11px;
  }

  .sc-header .nav a {
    min-height: 36px;
    padding: 6px 12px;
    font-size: 14px;
  }

  .sc-header .tools .btn,
  .sc-header .tools select {
    min-height: 36px;
  }

  .sc-header .tools .btn.icon {
    min-width: 36px;
    padding: 6px;
  }
}
</style>
<style>/* assets/css/site-footer.css */
/* Site footer. Moved from thakurg.html as it was. */
/* src/app/shared/site-footer.scss */
.sc-footer .foot {
  margin-block-start: 48px;
  padding-block: 28px;
  border-block-start: var(--header-border);
  background: var(--header-bg);
  -webkit-backdrop-filter: var(--header-filter);
  backdrop-filter: var(--header-filter);
}

.sc-footer .foot-in {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  align-items: center;
  justify-content: space-between;
}

.sc-footer .links {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
}

.sc-footer .links a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding-inline: 10px;
  color: var(--text);
  font-weight: 600;
}

.sc-footer p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

/* Prototype: the footer is pinned to the bottom of every page and kept compact; the page reserves its height so nothing hides behind it. */
:root {
  --foot-h: 52px;
}

.sc-footer .foot {
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: 50;
  margin: 0;
  padding-block: 4px calc(4px + env(safe-area-inset-bottom));
}

/* Links and copyright centred together; on narrow screens the copyright drops under the links. */
.sc-footer .foot-in {
  gap: 0 16px;
  justify-content: center;
  text-align: center;
}

.sc-footer .links {
  gap: 0 2px;
}

.sc-footer p {
  font-size: 13px;
}

body:has(.sc-footer) .sc-app main {
  padding-block-end: calc(var(--foot-h) + 16px + env(safe-area-inset-bottom));
}

body:has(.sc-footer) .proto-menu {
  inset-block-end: calc(var(--foot-h) + 12px);
}

/* Narrow screens: links on one line, the copyright line under them. */
@media (max-width: 720px) {
  :root {
    --foot-h: 70px;
  }

  .sc-footer .links {
    justify-content: center;
  }

  .sc-footer .links a {
    padding-inline: 7px;
  }

  .sc-footer p {
    font-size: 12px;
    padding-block-end: 2px;
  }
}

/* Wide screens: a slimmer footer bar (40px), so it takes less of the screen. Phones keep the 44px tap targets above. */
@media (min-width: 721px) {
  :root {
    --foot-h: 40px;
  }

  .sc-footer .links a {
    min-height: 32px;
    font-size: 14px;
  }

  .sc-footer p {
    font-size: 12px;
  }
}
</style>
<style>/* assets/css/speedtest.css */
/* Speed test page. Moved from thakurg.html as it was. */
/* src/app/pages/speedtest/speedtest.scss */
.sc-speed {
  display: block;
}

.sc-speed .page {
  display: grid;
  gap: 24px;
  padding-block: 24px 0;
}

.sc-speed .hero {
  text-align: center;
}

.sc-speed h1 {
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 5.5vw, 2.8rem);
  font-weight: 600;
  letter-spacing: -0.01em;
  max-width: 20ch;
  margin-inline: auto;
}

.sc-speed h1 em {
  font-style: italic;
  color: var(--accent-ink);
}

.sc-speed .lead {
  max-width: 56ch;
  margin: 0 auto 24px;
  color: var(--muted);
  font-size: clamp(1rem, 2.6vw, 1.125rem);
}

/* ---------- Dial ---------- */
/* A segmented 240° ring on the card itself (no box): bars light up with the speed, the leading bar glows,
   a small marker keeps the peak of the current phase, and the reading sits in the centre. */
.sc-speed .dial {
  position: relative;
  width: min(400px, 100%);
  margin: 0 auto 8px;
  container-type: inline-size;
}

/* A soft glow in the middle of the ring. It pulses while a test is running. 50cqi = the ring centre. */
.sc-speed .dial::before {
  content: "";
  position: absolute;
  inset-inline-start: 50%;
  inset-block-start: 50cqi;
  width: 64cqi;
  aspect-ratio: 1;
  translate: -50% -50%;
  border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--gauge-a) 28%, transparent), transparent 75%);
  opacity: 0.5;
  pointer-events: none;
}

.sc-speed .dial.live::before {
  animation: glow 1.8s ease-in-out infinite;
}

@keyframes glow {
  50% {
    opacity: 1;
    transform: scale(1.1);
  }
}
.sc-speed .dial svg {
  position: relative;
  display: block;
  width: 100%;
  height: auto;
}

.sc-speed .g-inner {
  fill: none;
  stroke: var(--muted);
  stroke-width: 1.2;
  stroke-dasharray: 0.1 6;
  stroke-linecap: round;
  opacity: 0.45;
}

.sc-speed .g-seg line {
  stroke: var(--track);
  stroke-width: 4.2;
  stroke-linecap: round;
  transition: stroke 0.25s, stroke-width 0.25s;
}

.sc-speed .g-seg line.on {
  stroke: color-mix(in srgb, var(--gauge-b) calc(var(--k) * 100%), var(--gauge-a));
  filter: drop-shadow(0 0 3px color-mix(in srgb, var(--gauge-a) 60%, transparent));
}

.sc-speed .g-seg line.head {
  stroke-width: 6.5;
  filter: drop-shadow(0 0 6px var(--gauge-b)) drop-shadow(0 0 12px var(--gauge-a));
}

.sc-speed .g-label {
  font: 700 10px var(--font-body);
  fill: var(--muted);
  opacity: 0.7;
  transition: fill 0.25s, opacity 0.25s;
}

.sc-speed .g-label.on {
  fill: var(--text);
  opacity: 1;
}

.sc-speed .g-peak {
  fill: var(--text);
  transition: opacity 0.2s;
}

.sc-speed .read {
  position: absolute;
  inset-inline: 0;
  inset-block-start: 50cqi;
  translate: 0 -50%;
  display: grid;
  justify-items: center;
  line-height: 1;
}

.sc-speed .val {
  font: 800 16cqi var(--font-body);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--text);
}

.sc-speed .unit {
  margin-block-start: 2.2cqi;
  font: 700 4.4cqi var(--font-body);
  letter-spacing: 0.02em;
  color: var(--muted);
}

/* ---------- One-screen layout ---------- */
/* A smaller title and lead, and on wide screens the meter on the left with the status, button and results on the right,
   so the whole test fits on one screen without scrolling. */
.sc-speed .page {
  padding-block: 16px 0;
}

.sc-speed .hero {
  padding-block: clamp(16px, 2.5vw, 28px);
}

.sc-speed h1 {
  max-width: none;
  margin-block-end: 0.3em;
  font-size: clamp(1.5rem, 3.4vw, 2.1rem);
}

.sc-speed .lead {
  margin-block-end: 12px;
  font-size: clamp(0.95rem, 1.6vw, 1.05rem);
}

@media (min-width: 960px) {
  .sc-speed .hero-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 32px;
    align-items: center;
  }

  .sc-speed .dial {
    width: min(360px, 100%);
  }

  .sc-speed .hero-side .status {
    margin-block-start: 0;
  }

  .sc-speed .hero-side .res {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    max-width: none;
    margin-block-start: 20px;
  }

  .sc-speed .hero-side .loaded,
  .sc-speed .hero-side .share-panel {
    max-width: none;
  }

  .sc-speed .hero-side .actions {
    margin-block-start: 16px;
  }
}

.sc-speed .result-img {
  display: block;
  width: min(560px, 100%);
  height: auto;
  margin: 0 auto 8px;
  border-radius: var(--radius, 16px);
}

.sc-speed .status {
  min-height: 1.6em;
  margin: 12px 0 14px;
  color: var(--muted);
  font-weight: 600;
}

.sc-speed .status.bad {
  color: var(--danger);
}

/* ---------- Clock, test timer and progress ---------- */
.sc-speed .live {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-block-start: 16px;
}

.sc-speed .chip {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  min-height: 40px;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
}

.sc-speed .chip .k {
  color: var(--inset-muted);
  font-size: 13px;
  font-weight: 700;
}

.sc-speed .chip .v {

<script>/* assets/js/routes.js */
/* The one route table of the prototype. The master dashboard builds its sidebar from it, and every page uses it to know
   which addresses it owns and which file to hand the others to. Add a feature here and it appears everywhere. */
'use strict';

/** Old addresses that the real site redirects. */
const ROUTE_REDIRECTS = { '/hr': '/HR', '/Nexon': '/nexon', '/Creta': '/creta', '/audio': '/creta', '/config': '/master', '/speedtest': '/' };

const ROUTE_GROUPS = [
  { id: 'site', label: { en: 'Website', hi: 'वेबसाइट', ar: 'الموقع' } },
  { id: 'apps', label: { en: 'Apps', hi: 'ऐप्स', ar: 'التطبيقات' } },
  { id: 'info', label: { en: 'Information', hi: 'जानकारी', ar: 'معلومات' } },
  { id: 'system', label: { en: 'System', hi: 'सिस्टम', ar: 'النظام' } },
];

/**
 * id: page id (also window.PAGE_ID of its file), file: the page in pages/, match: addresses it owns,
 * home: where the sidebar item goes (a function of the language for the speed test), links: extra sidebar links shown under the item,
 * outer/inner: for pages with their own address space (SnapTracker), how its addresses map into the dashboard's.
 */
const ROUTES = [
  {
    id: 'speed', group: 'site', file: 'speedtest.html', icon: 'gauge', match: /^\/(hi|ar)?$/, home: (lang) => (lang === 'en' ? '/' : '/' + lang),
    label: { en: 'Speed test', hi: 'स्पीड टेस्ट', ar: 'اختبار السرعة' },

  },
  {
    id: 'creta', group: 'site', file: 'creta.html', icon: 'music', match: /^\/creta(-add)?$/, home: '/creta',
    label: { en: 'Creta audio', hi: 'क्रेटा ऑडियो', ar: 'مشغل كريتا' },
    links: [{ path: '/creta-add', label: { en: 'Add songs', hi: 'गाने जोड़ें', ar: 'إضافة أغانٍ' } }],
  },
  {
    id: 'nexon', group: 'site', file: 'nexon.html', icon: 'music', match: /^\/nexon(-add)?$/, home: '/nexon',
    label: { en: 'Nexon audio', hi: 'नेक्सॉन ऑडियो', ar: 'مشغل نيكسون' },
    links: [{ path: '/nexon-add', label: { en: 'Add songs', hi: 'गाने जोड़ें', ar: 'إضافة أغانٍ' } }],
  },
  {
    id: 'hr', group: 'apps', file: 'hr.html', icon: 'users', match: /^\/HR$/, home: '/HR',
    label: { en: 'Atrium HR', hi: 'एट्रियम एचआर', ar: 'أتريوم للموارد البشرية' },
  },
  {
    id: 'khata', group: 'apps', file: 'khata.html', icon: 'book', match: /^\/khata(\/|$)/, home: '/khata',
    label: { en: 'SnapKhata', hi: 'स्नैपखाता', ar: 'سناب خاتا' },
    links: [
      { path: '/khata/app', label: { en: 'Open the app', hi: 'ऐप खोलें', ar: 'فتح التطبيق' } },
      { path: '/khata/login', label: { en: 'Log in', hi: 'लॉग इन', ar: 'تسجيل الدخول' } },
    ],
  },
  {
    id: 'tracker', group: 'apps', file: 'snaptracker.html', icon: 'spark', match: /^\/tracker(\/|$)/, home: '/tracker/app',
    label: { en: 'SnapTracker', hi: 'स्नैपट्रैकर', ar: 'سناب تراكر' },
    outer: (p) => '/tracker' + (p === '/' ? '' : p),
    inner: (p) => p.replace(/^\/tracker/, '') || '/',
  },
  {
    id: 'about', group: 'info', file: 'about.html', icon: 'info', match: /^\/about$/, home: '/about',
    label: { en: 'About', hi: 'हमारे बारे में', ar: 'حول الموقع' },

  {
    id: 'privacy', group: 'info', file: 'privacy.html', icon: 'shield', match: /^\/privacy$/, home: '/privacy',
    label: { en: 'Privacy', hi: 'गोपनीयता', ar: 'الخصوصية' },

  {

    label: { en: 'Settings', hi: 'सेटिंग्स', ar: 'الإعدادات' },

  {
    id: 'status', group: 'system', file: 'status.html', icon: 'alert', match: /^\/(404|error|offline|disabled)$/, home: '/404', fallback: true,
    label: { en: 'Status pages', hi: 'स्थिति पेज', ar: 'صفحات الحالة' },
    links: [
      { path: '/error', label: { en: 'Something went wrong', hi: 'कुछ गड़बड़ हो गई', ar: 'حدث خطأ ما' } },
      { path: '/offline', label: { en: 'You are offline', hi: 'आप ऑफ़लाइन हैं', ar: 'أنت غير متصل' } },
    ],
  },
];

const cleanPath = (path) => {
  const p = (String(path || '/').split('?')[0].replace(/\/+$/, '')) || '/';
  return ROUTE_REDIRECTS[p] || p;
};

/** The route that owns an address (dashboard address space). Unknown addresses belong to the status page (404). */
const routeFor = (path) => ROUTES.find((r) => r.match.test(cleanPath(path))) || ROUTES.find((r) => r.fallback);

const routeById = (id) => ROUTES.find((r) => r.id === id);

const routeHome = (r, lang) => (typeof r.home === 'function' ? r.home(lang) : r.home);

/** The address inside the page file for a dashboard address (only SnapTracker differs). */
const routeInner = (r, path) => (r.inner ? r.inner(path) : path);

/** The page file and hash for a dashboard address; `base` is '' from inside pages/ and 'pages/' from index.html. */
const routeUrl = (path, base) => {
  const r = routeFor(path);
  return `${base}${r.file}#${routeInner(r, path)}`;
};

<script>/* assets/js/bridge.js */
/* Shared by the master dashboard (index.html) and every page in pages/.
   PREFS: the one place that stores the language, the site skin and the light / dark mode (localStorage), and tells the other side when they change.
   BRIDGE: messages between the dashboard and the page in its content frame (navigation, current address, preferences).
   A page opened on its own (not inside the dashboard) still works: it reads the same preferences and links to the other page files directly. */
'use strict';

const PROTO_NS = 'thakurg-proto';

const PREFS = (() => {
  const KEYS = { lang: 'thakurg-proto-lang', skin: 'thakurg-proto-skin', mode: 'thakurg-proto-mode' };
  const ALLOWED = { lang: ['en', 'hi', 'ar'], skin: ['glass', 'clay', 'skeu', 'neu'], mode: ['light', 'dark', 'system'] };
  const DEFAULTS = { lang: 'en', skin: 'glass', mode: 'system' };
  const listeners = [];
  const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  const read = (k) => {
    try {
      const v = localStorage.getItem(KEYS[k]);
      return ALLOWED[k].includes(v) ? v : DEFAULTS[k];
    } catch {
      return DEFAULTS[k];
    }
  };
  const write = (k, v) => {
    try {
      localStorage.setItem(KEYS[k], v);
    } catch {
      /* private mode: the choice holds until the page closes */
    }
  };
  return {
    LANGS: [
      { code: 'en', native: 'English', dir: 'ltr' },
      { code: 'hi', native: 'हिन्दी', dir: 'ltr' },
      { code: 'ar', native: 'العربية', dir: 'rtl' },
    ],
    get: () => ({ lang: read('lang'), skin: read('skin'), mode: read('mode') }),
    /** light or dark, with "system" resolved from the device setting. */
    resolved: (mode = read('mode')) => (mode === 'system' ? (darkQuery && darkQuery.matches ? 'dark' : 'light') : mode),
    /** Saves the change and tells the other side (dashboard or page). Unknown values are ignored. */
    set(patch) {
      Object.entries(patch).forEach(([k, v]) => ALLOWED[k] && ALLOWED[k].includes(v) && write(k, v));
      this.announce();
    },
    /** Tells the other side the current preferences, for changes saved by existing page code. */
    announce() {
      BRIDGE.post({ type: 'prefs', prefs: this.get() });
    },
    /** Called when the other side changed a preference, or when the device switches light / dark while "system" is chosen. */
    onChange(fn) {
      listeners.push(fn);
    },
    emit() {
      const p = this.get();
      listeners.forEach((fn) => fn(p));
    },
    watchSystem() {
      if (darkQuery && darkQuery.addEventListener)
        darkQuery.addEventListener('change', () => read('mode') === 'system' && this.emit());
    },
  };
})();

const BRIDGE = (() => {
  const embedded = window.parent !== window;
  const handlers = {};
  let frame = null;
  const peer = () => (embedded ? window.parent : frame && frame.contentWindow);
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.ns !== PROTO_NS || !peer() || e.source !== peer())
      return;
    if (d.type === 'prefs')
      PREFS.emit();
    if (handlers[d.type])
      handlers[d.type](d);
  });
  // Another tab of the prototype changed a preference.
  window.addEventListener('storage', (e) => {
    if (e.key && e.key.startsWith('thakurg-proto-') && /-(lang|skin|mode)$/.test(e.key))
      PREFS.emit();
  });
  return {
    embedded,
    /** Dashboard side: the content frame. */
    attach(iframe) {
      frame = iframe;
    },
    on(type, fn) {
      handlers[type] = fn;
    },
    post(msg) {
      const w = peer();
      if (w)
        w.postMessage({ ns: PROTO_NS, ...msg }, '*');
    },
    /** Page side: does this page own the address (dashboard address space)? */
    owns(path) {
      return routeFor(path).id === window.PAGE_ID;
    },
    /** Page side: tells the dashboard where the page is now, so it can mark the sidebar and keep its own address. */
    report(innerPath, title) {
      if (!embedded)
        return;
      const r = routeById(window.PAGE_ID);
      this.post({ type: 'location', path: r && r.outer ? r.outer(innerPath) : innerPath, title: title || document.title });
    },
    /** Page side: an address that another page owns. Inside the dashboard the dashboard opens it; on its own the browser goes to that file. */
    leave(path) {
      if (embedded)
        this.post({ type: 'navigate', path });
      else
        location.href = routeUrl(path, window.PAGE_BASE || ''); // PAGE_BASE: 'pages/' for a page that sits next to index.html
    },
  };
})();

if (BRIDGE.embedded)
  document.documentElement.classList.add('in-dashboard');
PREFS.watchSystem();
</script>

aming and video calls on every device on your network.","info.acc.2":"Move close to your router, or connect a device with a cable.","info.acc.3":"Close other browser tabs and turn off any VPN.","info.acc.4":"Run the test two or three times and compare the results.","info.h2.fix":"How to fix slow internet","info.fix.1":"Restart your router and modem, then wait two minutes.","info.fix.2":"Place the router in an open, central spot, away from walls and appliances.","info.fix.3":"Switch to the 5 GHz Wi-Fi band for higher speed at short range.","info.fix.4":"Disconnect devices you are not using, and pause large background updates.","info.fix.5":"Update the router firmware, and replace an old router if it is several years old.","info.fix.6":"If speeds stay far below your plan on a cable connection, contact your internet provider.","info.h2.faq":"Frequently asked questions","faq.1.q":"How accurate is this internet speed test?","faq.1.a":"It measures against our own speed test server, so it shows your real-world speed to that server over the public internet. Results can vary slightly between runs because your connection, Wi-Fi signal and other devices on your network change from moment to moment. Run it two or three times and compare.","faq.2.q":"What is a good internet speed?","faq.2.a":"For most homes, 25 to 100 Mbps download is enough for HD streaming, video calls and browsing. Households with many devices, 4K streaming or large downloads benefit from 100 to 500 Mbps. Upload matters for video calls, cloud backups and live streaming, so aim for at least 10 Mbps.","faq.3.q":"Why is my speed lower than what my provider advertises?","faq.3.a":"Providers advertise the best-case speed on a wired connection. Wi-Fi distance, walls, router age, busy evening hours, other devices and a congested network can all reduce what you actually get. Testing with a cable connected to your router shows the true speed of your plan.","faq.4.q":"What is the difference between download and upload speed?","faq.4.a":"Download speed is how fast data comes to your device, which affects streaming, browsing and downloading files. Upload speed is how fast data leaves your device, which affects video calls, sending large files and posting videos.","faq.5.q":"What is ping and what is a good ping?","faq.5.a":"Ping, also called latency, is the time in milliseconds for data to travel to a server and back. Under 20 ms is excellent, 20 to 50 ms is good for gaming and calls, and above 100 ms can feel laggy.","faq.6.q":"What is jitter?","faq.6.a":"Jitter is how much your ping changes from one moment to the next. Low jitter means a steady connection. High jitter causes choppy video calls, voice dropouts and online game lag even when your download speed is high.","faq.7.q":"Is this speed test free?","faq.7.a":"Yes. It is completely free, needs no signup and works on phones, tablets and computers in any modern browser.","faq.8.q":"Does the test use a lot of data?","faq.8.a":"A full test downloads and uploads test data for about 25 seconds, so it can use a noticeable amount of data on a fast connection. If you are on a limited mobile plan, run it on Wi-Fi or sparingly.","seo.home.title":"Internet Speed Test: Check Download, Upload and Ping (Free)","seo.home.desc":"Free internet speed test. Check your download speed, upload speed, ping and jitter in 25 seconds. Works on phone and PC, no signup. Learn what a good speed is.","unit.gbps":"Gbps","unit.gbps_down":"Gbps download","unit.gbps_up":"Gbps upload","yt.h1":"YouTube music player","yt.placeholder.link":"Paste a YouTube link","yt.play":"Play","yt.needlink":"Paste a YouTube video link.","yt.lead":"Paste a YouTube link and play it here with YouTube's own player. Add songs to a queue, shuffle and repeat.","yt.label":"YouTube link","yt.placeholder":"Song name or YouTube link","yt.go":"Search","yt.searching":"Searching…","yt.results":"Search results","yt.queue":"Queue","yt.add":"Add to queue","yt.remove":"Remove from queue","yt.qual सेकंड में बता देता है कि आपका कनेक्शन असल में कितना तेज़ है। \"स्पीड टेस्ट शुरू करें\" दबाएं, और यह हमारे अपने स्पीड टेस्ट सर्वर के साथ आपकी डाउनलोड स्पीड, अपलोड स्पीड, पिंग और जिटर नापता है। यह किसी भी फ़ोन, टैबलेट या कंप्यूटर पर, Wi-Fi, मोबाइल डेटा या केबल पर चलता है, और साइन अप की ज़रूरत नहीं है।","info.h2.mean":"नतीजों का मतलब","info.mean.1":"डाउनलोड स्पीड (Mbps): डेटा आप तक कितनी तेज़ी से पहुंचता है। वीडियो स्ट्रीमिंग, वेब पेज, ऐप अपडेट और फ़ाइल डाउनलोड इसी पर निर्भर करते हैं।","info.mean.2":"अपलोड स्पीड (Mbps): आप कितनी तेज़ी से डेटा भेज पाते हैं। वीडियो कॉल, क्लाउड बैकअप, बड़ी फ़ाइलें भेजने और लाइव स्ट्रीमिंग के लिए यह ज़रूरी है।","info.mean.3":"पिंग (ms): आपके डिवाइस और सर्वर के बीच की देरी। कम होना बेहतर है, और 20 ms से कम गेमिंग और कॉल के लिए बहुत अच्छा है।","info.mean.4":"जिटर (ms): पिंग में कितना बदलाव आता है। कम होना बेहतर है, और स्थिर जिटर का मतलब है साफ़ कॉल और स्मूद गेम।","info.h2.good":"अच्छी इंटरनेट स्पीड कितनी होती है?","info.good":"मोटे तौर पर, 5 से 10 Mbps में एक HD वीडियो चलता है, 25 Mbps छोटे परिवार के लिए ठीक है, और 100 Mbps या ज़्यादा में कई लोग एक साथ स्ट्रीमिंग, घर से काम और गेमिंग आराम से कर सकते हैं। वीडियो कॉल के लिए कुछ Mbps की स्थिर अपलोड स्पीड चाहिए, इसलिए सिर्फ़ तेज़ डाउनलोड से अच्छी कॉल की गारंटी नहीं होती।","info.h2.accurate":"सबसे सही स्पीड टेस्ट नतीजा कैसे पाएं","info.acc.1":"अपने नेटवर्क के हर डिवाइस पर डाउनलोड, स्ट्रीमिंग और वीडियो कॉल रोक दें।","info.acc.2":"राउटर के पास जाएं, या किसी डिवाइस को केबल से जोड़ें।","info.acc.3":"ब्राउज़र के दूसरे टैब बंद करें और VPN बंद कर दें।","info.acc.4":"टेस्ट दो या तीन बार चलाएं और नतीजों की तुलना करें।","info.h2.fix":"धीमे इंटरनेट को कैसे ठीक करें","info.fix.1":"अपना राउटर और मॉडेम रीस्टार्ट करें, फिर दो मिनट रुकें।","info.fix.2":"राउटर को खुली, बीच की जगह पर रखें, दीवारों और बिजली के उपकरणों से दूर।","info.fix.3":"कम दूरी पर ज़्यादा स्पीड के लिए 5 GHz Wi-Fi बैंड पर जाएं।","info.fix.4":"जो डिवाइस इस्तेमाल में नहीं हैं उन्हें डिस्कनेक्ट करें, और बैकग्राउंड के बड़े अपडेट रोक दें।","info.fix.5":"राउटर का फ़र्मवेयर अपडेट करें, और अगर राउटर कई साल पुराना है तो बदल दें।","info.fix.6":"अगर केबल कनेक्शन पर भी स्पीड आपके प्लान से काफ़ी कम रहती है, तो अपने इंटरनेट प्रोवाइडर से संपर्क करें।","info.h2.faq":"अक्सर पूछे जाने वाले सवाल","faq.1.q":"यह इंटरनेट स्पीड टेस्ट कितना सही है?","faq.1.a":"यह हमारे अपने स्पीड टेस्ट सर्वर के साथ नापता है, इसलिए यह सार्वजनिक इंटरनेट पर उस सर्वर तक आपकी असली स्पीड दिखाता है। हर बार के नतीजों में थोड़ा फ़र्क़ हो सकता है, क्योंकि आपका कनेक्शन, Wi-Fi सिग्नल और नेटवर्क के दूसरे डिवाइस पल-पल बदलते रहते हैं। इसे दो या तीन बार चलाकर तुलना करें।","faq.2.q":"अच्छी इंटरनेट स्पीड कितनी होती है?","faq.2.a":"ज़्यादातर घरों के लिए 25 से 100 Mbps डाउनलोड HD स्ट्रीमिंग, वीडियो कॉल और ब्राउज़िंग के लिए काफ़ी है। जिन घरों में कई डिवाइस हैं, 4K स्ट्रीमिंग होती है या बड़े डाउनलोड होते हैं, उन्हें 100 से 500 Mbps से फ़ायदा होता है। वीडियो कॉल, क्लाउड बैकअप और लाइव स्ट्रीमिंग के लिए अपलोड भी मायने रखता है, इसलिए कम से कम 10 Mbps रखें।","faq.3.q":"मेरी स्पीड प्रोवाइडर के बताए से कम क्यों है?","faq.3.a":"प्रोवाइडर केबल कनेक्शन पर सबसे अच्छी स्थिति की स्पीड बताते हैं। Wi-Fi की दूरी, दीवारें, राउटर की उम्र, शाम की भीड़, दूसरे डिवाइस और भीड़ वाला नेटवर्क, सब असली स्पीड घटा सकते हैं। राउटर से केबल जोड़कर टेस्ट करने पर आपके प्लान की असली स्पीड दिखती है।","faq.4.q":"डाउनलोड और अपलोड स्पीड में क्या फ़र्क़ है?","faq.4.a":"डाउनलोड स्पीड बताती है कि डेटा आपके डिवाइस तक कितनी तेज़ी से आता है, जिसका असर स्ट्रीमिंग, ब्राउज़िंग और फ़ाइल डाउनलोड पर पड़ता है। अपलोड स्पीड बताती है कि डेटा आपके डिवाइस से कितनी तेज़ी से जाता है, जिसका असर वीडियो कॉल, बड़ी फ़ाइलें भेजने और वीडियो पोस्ट करने पर पड़ता है।","faq.5.q":"पिंग क्या है और अच्छी पिंग कितनी होती है?","faq.5.a":"पिंग, जिसे लेटेंसी भी कहते हैं, वह समय है (मिलीसेकंड में) जो डेटा को सर्वर तक जाने और वापस आने में लगता है। 20 ms से कम बहुत अच्छी है, 20 से 50 ms गेमिंग और कॉल के लिए अच्छी है, और 100 ms से ऊपर सुस्ती महसूस हो सकती है।","faq.6.q":"जिटर क्या है?","faq.6.a":"जिटर बताता है कि आपकी पिंग एक पल से दूसरे पल में कितनी बदलती है। कम जिटर का मतलब है स्थिर कनेक्शन। ज़्यादा जिटर से वीडियो कॉल अटकती है, आवाज़ कटती है और ऑनलाइन गेम में लैग आता है, भले ही डाउनलोड स्पीड ज़्यादा हो।","faq.7.q":"क्या यह स्पीड टेस्ट मुफ़्त है?","faq.7.a":"हां। यह पूरी तरह मुफ़्त है, साइन अप की ज़रूरत नहीं है, और किसी भी आधुनिक ब्राउज़र में फ़ोन, टैबलेट और कंप्यूटर पर चलता है।","faq.8.q":"क्या टेस्ट में बहुत डेटा खर्च होता है?","faq.8.a":"पूरा टेस्ट लगभग 25 सेकंड तक टेस्ट डेटा डाउनलोड और अपलोड करता है, इसलिए तेज़ कनेक्शन पर काफ़ी डेटा खर्च हो सकता है। अगर आपका मोबाइल प्लान सीमित है, तो इसे Wi-Fi पर या कम बार चलाएं।","seo.home.title":"इंटरनेट स्पीड टेस्ट: डाउनलोड, अपलोड और पिंग जांचें (मुफ़्त)","seo.home.desc":"मुफ़्त इंटरनेट स्पीड टेस्ट। 25 सेकंड में अपनी डाउनलोड स्पीड, अपलोड स्पीड, पिंग और जिटर जांचें। फ़ोन और पीसी पर चलता है, साइन अप नहीं चाहिए। जानें कि अच्छी स्पीड कितनी होती है।","unit.gbps":"Gbps","unit.gbps_down":"Gbps डाउनलोड","unit.gbps_up":"Gbps अपलोड","yt.h1":"यूट्यूब म्यूज़िक प्लेयर","yt.placeholder.link":"YouTube लिंक पेस्ट करें","yt.play":"चलाएं","yt.needlink":"YouTube वीडियो का लिंक पेस्ट करें।","yt.lead":"YouTube लिंक पेस्ट करें और YouTube के अपने प्लेयर से यहीं चलाएं। गाने कतार में जोड़ें, शफ़ल और रिपीट करें।","yt.label":"YouTube लिंक","yt.placeholder":"गाने का नाम या यूट्यूब लिंक","yt.go":"चलाएं","yt.searching":"खोज रहे हैं…","yt.results":"खोज के नतीजे","yt.queue":"कतार","yt.add":"कतार में जोड़ें","yt.remove":"कतार से हटाएं","yt.quality":"वीडियो क्वालिटी","yt.quality.auto":"क्वालिटी: ऑटो","yt.fullscreen":"फ़ुलस्क्रीन","yt.tip.desktop":"सुझाव: स्क्रीन बंद होने पर भी संगीत चलता रहे, इसके लिए ब्राउज़र मेन्यू खोलकर \"Desktop site\" चालू करें।","yt.tip.ok":"ठीक है","yt.serverdown":"म्यूज़िक सर्वर तक नहीं पहुँच सके। कृपया थोड़ी देर बाद फिर कोशिश करें।","yt.pl.title":"मेरी प्लेलिस्ट","yt.pl.new":"नई प्लेलिस्ट का नाम","yt.pl.create":"प्लेलिस्ट बनाएँ","yt.pl.name":"प्लेलिस्ट का नाम","yt.pl.saveq":"कतार को प्लेलिस्ट के रूप में सहेजें","yt.pl.addto":"गाने यहाँ जोड़ें:","yt.pl.add":"प्लेलिस्ट में जोड ट के नतीजे आपके डिवाइस पर ही रहते हैं।","about.h2.tools":"यहां आप क्या कर सकते हैं","about.l.speed":"अपनी इंटरनेट स्पीड जांचें","about.l.hr":"एट्रियम एचआर डेमो देखें","about.l.creta":"क्रेटा ऑडियो प्लेयर पर सुनें","seo.about.title":"thakurg.com के बारे में","seo.about.desc":"thakurg.com के बारे में: मुफ़्त इंटरनेट स्पीड टेस्ट, एट्रियम एचआर डेमो और क्रेटा ऑडियो प्लेयर।","privacy.h1":"गोपनीयता नीति","privacy.p1":"यह साइट आपसे साइन अप नहीं करवाती और कोई व्यक्तिगत जानकारी इकट्ठा नहीं करती।","privacy.p2":"आपकी चुनी हुई भाषा, थीम और सेव किए गए स्पीड टेस्ट के नतीजे आपके अपने ब्राउज़र (लोकल स्टोरेज) में रखे जाते हैं। ये कभी हमारे सर्वर पर नहीं भेजे जाते और आप इन्हें कभी भी हटा सकते हैं।","privacy.p3":"जब आप स्पीड टेस्ट चलाते हैं, तो आपका ब्राउज़र टेस्ट डेटा भेजने-पाने के लिए हमारे अपने स्पीड टेस्ट सर्वर से जुड़ता है। किसी भी वेबसाइट अनुरोध की तरह, इस कनेक्शन में हमारा सर्वर आपका IP पता देख सकता है। कनेक्शन विवरण और सेवाओं की स्थिति वाले हिस्से ipwho.is, api4.ipify.org और api6.ipify.org (आपका IPv4 और IPv6 पता दिखाने के लिए) और सूचीबद्ध सेवाओं के सार्वजनिक स्टेटस पेज से भी जुड़ते हैं। ये अनुरोध सीधे आपके ब्राउज़र से जाते हैं और कुछ भी सहेजा नहीं जाता।","privacy.p4":"साइट अपने फ़ॉन्ट खुद उपलब्ध कराती है। सिर्फ़ एट्रियम एचआर डेमो Google Fonts से फ़ॉन्ट लोड करता है, और उसे खोलने पर Google को आपका IP पता मिल सकता है।","privacy.p5":"अगर यह नीति बदलती है, तो नया संस्करण इसी पेज पर प्रकाशित किया जाएगा।","seo.privacy.title":"गोपनीयता नीति","seo.privacy.desc":"thakurg.com आपके डेटा को कैसे संभालता है। साइन अप नहीं, कोई व्यक्तिगत डेटा नहीं, नतीजे आपके ब्राउज़र में रहते हैं।","terms.h1":"उपयोग की शर्तें","terms.p1":"इस साइट के टूल्स मुफ़्त और \"जैसे हैं वैसे\" दिए जाते हैं, किसी भी तरह की वारंटी के बिना।","terms.p2":"स्पीड टेस्ट के नतीजे अनुमान हैं। ये आपके डिवाइस, नेटवर्क, ब्राउज़र और टेस्ट सर्वर की दूरी पर निर्भर करते हैं, और प्रोवाइडर की बताई स्पीड से अलग हो सकते हैं।","terms.p3":"पूरा स्पीड टेस्ट लगभग 25 सेकंड तक टेस्ट डेटा ट्रांसफ़र करता है, जो सीमित डेटा प्लान में गिना जा सकता है। الخادم. الأقل أفضل، وأقل من 20 ms ممتاز للألعاب والمكالمات.","info.mean.4":"الاهتزاز (ms): مقدار تغيّر زمن الاستجابة. الأقل أفضل، والاهتزاز الثابت يعني مكالمات وألعابًا سلسة.","info.h2.good":"ما هي سرعة الإنترنت الجيدة؟","info.good":"كدليل تقريبي، تكفي سرعة من 5 إلى 10 Mbps لبث فيديو واحد بجودة HD، وتناسب سرعة 25 Mbps أسرة صغيرة، وتريح سرعة 100 Mbps أو أكثر عدة أشخاص يبثون ويعملون من المنزل ويلعبون في الوقت نفسه. تحتاج مكالمات الفيديو إلى سرعة رفع ثابتة تبلغ بضعة Mbps، لذا فإن التنزيل السريع وحده لا يضمن مكالمة جيدة.","info.h2.accurate":"كيف تحصل على أدق نتيجة لاختبار السرعة","info.acc.1":"أوقف التنزيلات والبث ومكالمات الفيديو على كل جهاز في شبكتك.","info.acc.2":"اقترب من الراوتر، أو صِل جهازًا به بكابل.","info.acc.3":"أغلق علامات تبويب المتصفح الأخرى وأوقف أي VPN.","info.acc.4":"كرر الاختبار مرتين أو ثلاث مرات وقارن النتائج.","info.h2.fix":"كيف تعالج بطء الإنترنت","info.fix.1":"أعد تشغيل الراوتر والمودم، ثم انتظر دقيقتين.","info.fix.2":"ضع الراوتر في مكان مفتوح ومركزي، بعيدًا عن الجدران والأجهزة.","info.fix.3":"انتقل إلى نطاق Wi-Fi بتردد 5 GHz للحصول على سرعة أعلى عن قرب.","info.fix.4":"افصل الأجهزة التي لا تستخدمها، وأوقف التحديثات الكبيرة في الخلفية.","info.fix.5":"حدّث البرنامج الثابت للراوتر، واستبدل الراوتر إذا كان عمره عدة سنوات.","info.fix.6":"إذا بقيت السرعة أقل بكثير من باقتك على اتصال الكابل، فتواصل مع مزوّد الإنترنت.","info.h2.faq":"الأسئلة الشائعة","faq.1.q":"ما مدى دقة اختبار سرعة الإنترنت هذا؟","faq.1.a":"يقيس مع خادم اختبار السرعة الخاص بنا، فيُظهر سرعتك الفعلية نحو هذا الخادم عبر الإنترنت العام. قد تختلف النتائج قليلًا بين مرة وأخرى لأن اتصالك وإشارة Wi-Fi والأجهزة الأخرى في شبكتك تتغير من لحظة إلى أخرى. أعد الاختبار مرتين أو ثلاث وقارن.","faq.2.q":"ما هي سرعة الإنترنت الجيدة؟","faq.2.a":"في معظم المنازل، تكفي سرعة تنزيل من 25 إلى 100 Mbps للبث بجودة HD ومكالمات الفيديو والتصفح. وتستفيد المنازل التي فيها أجهزة كثيرة أو بث 4K أو تنزيلات كبيرة من 100 إلى 500 Mbps. وتهم سرعة الرفع في مكالمات الفيديو والنسخ الاحتياطي السحابي والبث المباشر، لذا استهدف 10 Mbps على الأقل.","faq.3.q":"لماذا سرعتي أقل مما يعلنه مزوّد الخدمة؟","faq.3.a":"يعلن المزوّدون عن أفضل سرعة ممكنة على اتصال سلكي. يمكن لبُعد Wi-Fi والجدران وعمر الراوتر وساعات الذروة المسائية والأجهزة الأخرى والشبكة المزدحمة أن تقلل ما تحصل عليه فعلًا. الاختبار بكابل موصول بالراوتر يُظهر السرعة الحقيقية لباقتك.","faq.4.q":"ما الفرق بين سرعة التنزيل وسرعة الرفع؟","faq.4.a":"سرعة التنزيل هي مدى سرعة وصول البيانات إلى جهازك، وتؤثر في البث والتصفح وتنزيل الملفات. وسرعة الرفع هي مدى سرعة خروج البيانات من جهازك، وتؤثر في مكالمات الفيديو وإرسال الملفات الكبيرة ونشر الفيديوهات.","faq.5.q":"ما هو زمن الاستجابة (Ping) وما القيمة الجيدة له؟","faq.5.a":"زمن الاستجابة، ويسمى أيضًا التأخر، هو الوقت بالميلي ثانية الذي تستغرقه البيانات للوصول إلى الخادم والعودة. أقل من 20 ms ممتاز، ومن 20 إلى 50 ms جيد للألعاب والمكالمات، وأكثر من 100 ms قد يبدو بطيئًا.","faq.6.q":"ما هو الاهتزاز (Jitter)؟","faq.6.a":"الاهتزاز هو مقدار تغيّر زمن الاستجابة من لحظة إلى التالية. الاهتزاز المنخفض يعني اتصالًا مستقرًا. أما الاهتزاز المرتفع فيسبب تقطع مكالمات الفيديو وانقطاع الصوت وتأخر الألعاب حتى لو كانت سرعة التنزيل عالية.","faq.7.q":"هل اختبار السرعة هذا مجاني؟","faq.7.a":"نعم. إنه مجاني تمامًا، ولا يتطلب تسجيلًا، ويعمل على الهواتف والأجهزة اللوحية والحواسيب في أي متصفح حديث.","faq.8.q":"هل يستهلك الاختبار الكثير من البيانات؟","faq.8.a":"يقوم الاختبار الكامل بتنزيل ورفع بيانات اختبارية لمدة 25 ثانية تقريبًا، لذا قد يستهلك قدرًا ملحوظًا من البيانات على اتصال سريع. إذا كانت باقة الجوال لديك محدودة، فأجرِه عبر Wi-Fi أو نادرًا.","seo.home.title":"اختبار سرعة الإنترنت: افحص التنزيل والرفع وزمن الاستجابة (مجاني)","seo.home.desc":"اختبار سرعة إنترنت مجاني. افحص سرعة التنزيل وسرعة الرفع وزمن الاستجابة والاهتزاز خلال 25 ثانية. يعمل على الهاتف والكمبيوتر دون تسجيل. تعرّف على السرعة الجيدة.","unit.gbps":"Gbps","unit.gbps_down":"Gbps تنزيل","unit.gbps_up":"Gbps رفع","yt.h1":"مشغل موسيقى يوتيوب","yt.placeholder.link":"الصق رابط YouTube","yt.play":"تشغيل","yt.needlink":"الصق رابط فيديو YouTube.","yt.lead":"الصق ر const SERVICES = [{"id":"teams","name":"Microsoft Teams","group":"apps","url":"https://teams.microsoft.com","status":false},{"id":"github","name":"GitHub","group":"apps","url":"https://github.com","status":true},{"id":"cloudflare","name":"Cloudflare","group":"apps","url":"https://www.cloudflare.com","status":true},{"id":"discord","name":"Discord","group":"apps","url":"https://discord.com","status":true},{"id":"facebook","name":"Facebook","group":"apps","url":"https://www.facebook.com","status":false},{"id":"whatsapp","name":"WhatsApp","group":"apps","url":"https://web.whatsapp.com","status":false},{"id":"x","name":"X","group":"apps","url":"https://x.com","status":false},{"id":"reddit","name":"Reddit","group":"apps","url":"https://www.reddit.com","status":true},{"id":"zoom","name":"Zoom","group":"apps","url":"https://zoom.us","status":true},{"id":"npm","name":"npm","group":"apps","url":"https://www.npmjs.com","status":true},{"id":"instagram","name":"Instagram","group":"apps","url":"https://www.instagram.com","status":false},{"id":"youtube","name":"YouTube","group":"apps","url":"https://www.youtube.com","status":false},{"id":"google","name":"Google","group":"apps","url":"https://www.google.com","status":false},{"id":"slack","name":"Slack","group":"apps","url":"https://slack.com","status":false},{"id":"telegram","name":"Telegram","group":"apps","url":"https://web.telegram.org","status":false},{"id":"dropbox","name":"Dropbox","group":"apps","url":"https://www.dropbox.com","status":true},{"id":"jio","name":"Jio","group":"telecom","url":"https://www.jio.com","status":false},{"id":"airtel","name":"Airtel","group":"telecom","url":"https://www.airtel.in","status":false},{"id":"vi","name":"Vi","group":"telecom","url":"https://www.myvi.in","status":false},{"id":"bsnl","name":"BSNL","group":"telecom","url":"https://www.bsnl.co.in","status":false}];
