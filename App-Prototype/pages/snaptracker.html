<script>
  // Paint the shared light / dark choice before the first frame.
  (function () {
    try {
      var m = localStorage.getItem('thakurg-proto-mode');
      if (m === 'light' || m === 'dark')
        document.documentElement.setAttribute('data-theme', m);
    } catch (e) {}
  })();
</script>
