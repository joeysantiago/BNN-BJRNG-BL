<div class="k-xwrap" [class.open]="open()" [class.off]="disabled()">
  <button type="button" class="k-btn icon k-x-main" aria-haspopup="true" aria-controls="k-xgroup" [attr.aria-expanded]="open()" [disabled]="disabled()" [title]="i18n.t('khata.x.export')"
    [attr.aria-label]="i18n.t('khata.x.export')" (click)="toggle()">
    @if (busy()) {
      <span class="k-spin" aria-hidden="true"></span>
    } @else {
      <svg kIco="download"></svg>
    }
  </button>
  <div id="k-xgroup" class="k-xgroup" role="group" [attr.aria-label]="i18n.t('khata.x.export')">
    @for (f of formats; track f) {
      <button type="button" [class]="'k-btn icon k-x k-x-' + f" [disabled]="disabled() || !!busy()" [title]="i18n.t('khata.x.' + f + 'Title')" [attr.aria-label]="i18n.t('khata.x.' + f + 'Title')"
        (click)="download(f)">
        <svg [kIco]="icons[f]" [size]="20"></svg>
      </button>
    }
  </div>
</div>
@if (error()) {
  <p class="k-err k-x-err" role="alert"><svg kIco="alert" [size]="16"></svg><span>{{ error() }}</span></p>
}
