<article class="card tc" [class]="'card tc p-' + priority()" [class.is-done]="done()" [class.sel]="picked()" [class.flash]="state.flash() === task().id">
  @if (state.selecting()) {
    <button type="button" class="cc sq" [class.on]="picked()" [attr.aria-pressed]="picked()" [attr.aria-label]="i18n.t('tasks.select.one', { title: task().title })" (click)="state.pick(task())"><app-task-icon name="check" [size]="14" /></button>
  } @else {
    <button type="button" class="cc" [class.on]="done()" [attr.aria-pressed]="done()" [attr.aria-label]="i18n.t(done() ? 'tasks.reopenOne' : 'tasks.completeOne', { title: task().title })" (click)="state.toggle(task())">
      <app-task-icon name="check" [size]="15" />
    </button>
  }
  <button type="button" class="t-main" (click)="main()">
    <span class="t-title">{{ task().title }}</span>
    @if (task().description) {
      <span class="t-desc">{{ task().description }}</span>
    }
    <span class="t-meta">
      @if (task().dueDate) {
        <span [class]="dueClass()"><app-task-icon name="cal" [size]="14" />{{ state.friendlyDue(task()) }}</span>
      } @else {
        <span class="faint">{{ i18n.t('tasks.due.none') }}</span>
      }
      <span class="pill" [class.ok]="status() === 'completed'" [class.bad]="status() === 'overdue'" [class.brand]="status() === 'ongoing'">{{ i18n.t('tasks.status.' + status()) }}</span>
      <span><span class="dot" [style.background]="category()?.color ?? '#94a3b8'"></span>{{ state.categoryName(category()) }}</span>
      <span><app-task-icon name="flag" [size]="14" />{{ i18n.t('tasks.pri.' + task().priority) }}</span>
      @if (repeat()) {
        <span><app-task-icon name="repeat" [size]="14" />{{ repeat() }}</span>
      }
      @if (task().attachments.length) {
        <span [attr.aria-label]="i18n.t('tasks.photo.count', { n: task().attachments.length })"><app-task-icon name="clip" [size]="14" />{{ task().attachments.length }}</span>
      }
    </span>
    @if (total()) {
      <span class="prog"><span class="bar" [class.full]="ticked() === total()"><i [style.width.%]="percent()"></i></span><span class="num">{{ i18n.t('tasks.progress', { done: ticked(), total: total() }) }}</span></span>
    }
    @if (done()) {
      <span class="t-done-line">
        <span>{{ i18n.t('tasks.dueOn', { date: task().dueDate ? formatYmd(task().dueDate) : '-' }) }}</span><span><app-task-icon name="check" [size]="14" />{{ i18n.t('tasks.completedOn', { date: completedOn() }) }}</span>
      </span>
    }
  </button>
  <div class="t-side">
    @if (task().attachments[0]; as first) {
      <button type="button" class="t-thumb-btn" [attr.aria-label]="i18n.t('tasks.photo.view')" (click)="photos()"><img class="t-thumb" [src]="state.photoUrl(first.id)" alt="" loading="lazy" width="44" height="44" /></button>
    }
    @if (total() && !state.selecting()) {
      <button type="button" class="btn ghost icon sm expand" [attr.aria-expanded]="open()" [attr.aria-label]="i18n.t('tasks.checklist.show')" (click)="state.expand(task())"><app-task-icon name="chev" [size]="18" /></button>
    }
  </div>
  @if (open() && total() && !state.selecting()) {
    <div class="inline-cl">
      @for (item of task().checklist; track item.id) {
        <div class="cl-item" [class.done]="item.isDone">
          <button type="button" class="cc sm" [class.on]="item.isDone" [attr.aria-pressed]="item.isDone" [attr.aria-label]="item.text" (click)="state.toggleItem(task(), item.id)"><app-task-icon name="check" [size]="13" /></button>
          <span class="tx">{{ item.text }}</span>
        </div>
      }
    </div>
  }
</article>
