<section class="card conn" id="connection-details" aria-labelledby="conn-h">
  <div class="head">
    <h2 id="conn-h">{{ i18n.page('connection') }}</h2>
    <button type="button" class="btn sm" [disabled]="conn.loading()" (click)="reload()">{{ i18n.t('conn.refresh') }}</button>
  </div>
  <p class="lead">{{ i18n.t('conn.lead') }}</p>

  <dl class="grid" aria-live="polite">
    @for (r of rows(); track r.id) {
      <div class="cell inset">
        <dt>{{ i18n.t(r.label) }}</dt>
        <dd [class.na]="!r.found">{{ r.text }}</dd>
      </div>
    }
  </dl>

  <p class="note">{{ i18n.t('conn.note') }}</p>
</section>
