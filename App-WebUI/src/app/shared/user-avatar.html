@if (url(); as src) {
  <img [src]="src" [attr.alt]="label() ?? ''" [attr.aria-hidden]="label() ? null : 'true'" [width]="size()" [height]="size()" loading="lazy" decoding="async" />
} @else {
  <span class="initials" [attr.role]="label() ? 'img' : null" [attr.aria-label]="label()" [attr.aria-hidden]="label() ? null : 'true'">{{ initials() }}</span>
}
