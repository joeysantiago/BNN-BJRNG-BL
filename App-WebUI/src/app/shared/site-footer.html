<footer class="foot">

          <a routerLink="/about/">{{ i18n.page('about') }}</a>
        }
        @if (cfg.on('page.privacy')) {

    <p>&copy; {{ year }} {{ site }}. {{ i18n.t('ft.rights') }}</p>
  </div>
