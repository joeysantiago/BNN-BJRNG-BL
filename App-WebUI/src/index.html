<!doctype html>
<html lang="en" dir="ltr" data-skin="glass" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <title>Internet Speed Test: Check Download, Upload and Ping (Free)</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#170a1c" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="Speed Test" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Speed Test" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Routes use the hash (/#/creta). A plain path such as /creta/ is moved to /#/creta before Angular starts.
         An installed app runs at its own path /apps/<code>/ (its manifest scope), which is kept: without a screen in the hash it opens the app's
         first screen, and the site's manifest is dropped here so the browser never offers the speed test in another app's window
         (AppPwaService then adds the app's own manifest). -->
    <script>
      (function () {
        var p = location.pathname;
        var a = /^\/apps\/([a-z]+)\/?$/.exec(p);
        var homes = { speedtest: '/', creta: '/creta', nexon: '/nexon', youtube: '/youtube', khata: '/khata/app', tasks: '/tasks/app' };
        if (a && homes[a[1]]) {
          if (!/^#\//.test(location.hash)) location.replace('/apps/' + a[1] + '/' + location.search + '#' + homes[a[1]]);
          var m = a[1] !== 'speedtest' && document.querySelector('link[rel=manifest]');
          if (m) m.remove();
        } else if (p !== '/' && !/^#\//.test(location.hash) && !/\.\w+$/.test(p)) location.replace('/#' + p.replace(/\/+$/, '') + location.search);
      })();
    </script>

    <!-- The browser can offer the install prompt before Angular starts (it first waits for the settings and texts from the API, which can be slow),
         so the prompt is kept here and InstallService picks it up; otherwise the Install button would never appear. -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPrompt = e;
      });
      window.addEventListener('appinstalled', function () {
        window.__installPrompt = null;
      });
    </script>

    <!-- Apply the saved look before the first paint so there is no flash of the wrong skin. -->
    <script>
      (function () {
        try {
          var el = document.documentElement;
          var s = localStorage.getItem('thakurg-skin');
          if (!s || !/^(glass|clay|skeu|neu)$/.test(s)) s = 'glass';
          el.setAttribute('data-skin', s);
          // Brightness: the visitor's choice (dark, light, or system = the device), otherwise the skin's own (Glass dark, the others light).
          var m = localStorage.getItem('thakurg-mode');
          var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) || (m !== 'light' && m !== 'system' && s === 'glass');
          el.setAttribute('data-mode', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">This site needs JavaScript to run the speed test. Please turn it on and reload the page.</p>
    </noscript>
  </body>
</html>
