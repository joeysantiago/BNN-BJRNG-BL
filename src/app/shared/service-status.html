<section class="card svc" id="services-status" aria-labelledby="svc-h">
  <div class="head">
    <h2 id="svc-h">{{ i18n.page('services') }}</h2>
    <button type="button" class="btn sm" (click)="recheck()">{{ i18n.t('svc.refresh') }}</button>
  </div>
  <p class="lead">{{ i18n.t('svc.lead') }}</p>
  <p class="summary" aria-live="polite">{{ summary() }}</p>

  @for (g of groups; track g.id) {
    <h3>{{ i18n.t(g.label) }}</h3>
    <ul class="list">
      @for (s of g.items; track s.id) {
        <li class="tile" [attr.data-state]="stateId(s.id)">
          <a class="name" [href]="s.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="i18n.t('svc.open', { name: s.name })">{{ s.name }}</a>
          <span class="pill"><i class="dot" aria-hidden="true"></i>{{ i18n.t(state(s.id)) }}</span>
          <small class="src">{{ i18n.t(source(s.id)) }}</small>
        </li>
      }
    </ul>
  }

  <p class="note">{{ i18n.t('svc.note') }}</p>
</section>
