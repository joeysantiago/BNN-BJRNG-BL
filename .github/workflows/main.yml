name: Deploy to GitHub Pages

on:
  push:
    branches: [Mojito]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Angular app lives in App-WebUI.
        working-directory: App-WebUI
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App-WebUI/package-lock.json
      - run: npm ci
      # prebuild regenerates public/audio/playlist.json, then ng build prerenders every page and
      # scripts/postbuild.mjs creates 404.html, CNAME, robots.txt and sitemap.xml (see package.json).
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: App-WebUI/dist/thakurg/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages sometimes takes far longer than usual to publish (one run waited over 10 minutes, the default limit, and failed
          # although the build was fine). Wait up to 30 minutes before giving up.
          timeout: 1800000
