name: Website QA
on:
  push:
    branches: [banni-linux]
    paths: ['App-WebUI/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App-WebUI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App-WebUI/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build:qa
      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          external_repository: ${{ github.repository_owner }}/thakurg-qa-site
          publish_branch: gh-pages
          publish_dir: App-WebUI/dist/thakurg/browser
          cname: qa.thakurg.com